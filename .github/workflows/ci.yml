name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y nasm
      - run: pip install -e '.[dev]'
      - run: python3 tools/gen_curriculum.py --check
      - run: ring check-levels
      - name: pytest
        shell: bash
        run: |
          pytest -q -rf --tb=short 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          # failures as annotations too, so they show up without opening the log
          grep -E "^(FAILED|E  )" pytest.log | head -30 | sed 's/^/::error::/' || true
          exit $status

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/Dockerfile -t nasm-adventures .
      - name: smoke test
        run: docker run --rm -v "$PWD/docker/smoke_test.sh:/smoke_test.sh:ro" nasm-adventures bash /smoke_test.sh
