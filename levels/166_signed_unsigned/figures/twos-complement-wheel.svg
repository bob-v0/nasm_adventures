<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" width="640" height="440" role="img">
<title>The 256 values of a byte on a wheel, read as unsigned and as signed</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker></defs>
<rect x="0" y="0" width="640" height="440" fill="#ffffff"/>
<circle cx="320" cy="225" r="140" fill="none" stroke="#6b7280" stroke-width="2"/>
<circle cx="320.0" cy="85.0" r="5" fill="#222222"/>
<text x="320.0" y="49.0" font-family="monospace" font-size="14" xml:space="preserve" text-anchor="middle" font-weight="bold" fill="#222222">0</text>
<text x="320.0" y="65.0" font-family="monospace" font-size="14" xml:space="preserve" text-anchor="middle" font-weight="bold" fill="#1d4ed8">0</text>
<circle cx="353.9" cy="89.2" r="5" fill="#222222"/>
<text x="362.1" y="54.2" font-family="monospace" font-size="14" xml:space="preserve" text-anchor="middle" font-weight="bold" fill="#222222">1</text>
<text x="362.1" y="70.2" font-family="monospace" font-size="14" xml:space="preserve" text-anchor="middle" font-weight="bold" fill="#1d4ed8">+1</text>
<circle cx="286.1" cy="89.2" r="5" fill="#222222"/>
<text x="277.9" y="54.2" font-family="monospace" font-size="14" xml:space="preserve" text-anchor="middle" font-weight="bold" fill="#222222">255</text>
<text x="277.9" y="70.2" font-family="monospace" font-size="14" xml:space="preserve" text-anchor="middle" font-weight="bold" fill="#1d4ed8">−1</text>
<circle cx="460.0" cy="225.0" r="5" fill="#222222"/>
<text x="480.0" y="223.0" font-family="monospace" font-size="14" xml:space="preserve" text-anchor="start" font-weight="bold" fill="#222222">64</text>
<text x="480.0" y="239.0" font-family="monospace" font-size="14" xml:space="preserve" text-anchor="start" font-weight="bold" fill="#1d4ed8">+64</text>
<circle cx="353.9" cy="360.8" r="5" fill="#222222"/>
<text x="362.1" y="391.8" font-family="monospace" font-size="14" xml:space="preserve" text-anchor="middle" font-weight="bold" fill="#222222">127</text>
<text x="362.1" y="407.8" font-family="monospace" font-size="14" xml:space="preserve" text-anchor="middle" font-weight="bold" fill="#1d4ed8">+127</text>
<circle cx="286.1" cy="360.8" r="5" fill="#222222"/>
<text x="277.9" y="391.8" font-family="monospace" font-size="14" xml:space="preserve" text-anchor="middle" font-weight="bold" fill="#222222">129</text>
<text x="277.9" y="407.8" font-family="monospace" font-size="14" xml:space="preserve" text-anchor="middle" font-weight="bold" fill="#1d4ed8">−127</text>
<circle cx="320.0" cy="365.0" r="5" fill="#222222"/>
<text x="320.0" y="397.0" font-family="monospace" font-size="14" xml:space="preserve" text-anchor="middle" font-weight="bold" fill="#222222">128</text>
<text x="320.0" y="413.0" font-family="monospace" font-size="14" xml:space="preserve" text-anchor="middle" font-weight="bold" fill="#1d4ed8">−128</text>
<circle cx="180.0" cy="225.0" r="5" fill="#222222"/>
<text x="160.0" y="223.0" font-family="monospace" font-size="14" xml:space="preserve" text-anchor="end" font-weight="bold" fill="#222222">192</text>
<text x="160.0" y="239.0" font-family="monospace" font-size="14" xml:space="preserve" text-anchor="end" font-weight="bold" fill="#1d4ed8">−64</text>
<line x1="320" y1="73" x2="320" y2="97" stroke="#c2410c" stroke-width="3"/>
<line x1="320" y1="353" x2="320" y2="377" stroke="#15803d" stroke-width="3"/>
<text x="320" y="185" font-family="sans-serif" font-size="13" xml:space="preserve" text-anchor="middle" font-weight="normal" fill="#c2410c">unsigned wraps between 255 and 0:</text>
<text x="320" y="203" font-family="sans-serif" font-size="13" xml:space="preserve" text-anchor="middle" font-weight="bold" fill="#c2410c">crossing here sets CF</text>
<text x="320" y="253" font-family="sans-serif" font-size="13" xml:space="preserve" text-anchor="middle" font-weight="normal" fill="#15803d">signed wraps between +127 and −128:</text>
<text x="320" y="271" font-family="sans-serif" font-size="13" xml:space="preserve" text-anchor="middle" font-weight="bold" fill="#15803d">crossing here sets OF</text>
<text x="20" y="24" font-family="sans-serif" font-size="13" xml:space="preserve" text-anchor="start" font-weight="bold" fill="#222222">black: unsigned reading</text>
<text x="20" y="42" font-family="sans-serif" font-size="13" xml:space="preserve" text-anchor="start" font-weight="bold" fill="#1d4ed8">blue: signed (two's complement)</text>
<text x="620" y="24" font-family="sans-serif" font-size="13" xml:space="preserve" text-anchor="end" font-weight="normal" fill="#6b7280">adding moves clockwise</text>
<text x="620" y="42" font-family="sans-serif" font-size="13" xml:space="preserve" text-anchor="end" font-weight="normal" fill="#6b7280">subtracting moves anticlockwise</text>
</svg>
