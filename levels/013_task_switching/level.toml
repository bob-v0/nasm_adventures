  "schedule: from [current] + 1, wrapping around after TASKS - 1, look for T_STATE = 1 (tasks are T_SIZE bytes, in `tasks`); stop after TASKS tries. Found the current one again: just return. Another: switch_to(current, it). None: s_all, cli, hlt. ([current] starts at -1, so the first one found is task 0; switch_to(-1, ...) has nothing to save.)",
