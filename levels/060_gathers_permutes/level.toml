concepts = ["gathers: one load per lane, from addresses in a vector", "the gather mask: which lanes, and why it's consumed", "lane-crossing permutes: vpermd and its index vector", "in-lane vs cross-lane shuffles in AVX2", "widening bytes to dwords: vpmovzxbd", "gathers aren't magic: they cost as many loads as lanes"]
