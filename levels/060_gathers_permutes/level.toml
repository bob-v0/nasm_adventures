hints = [
  "vpmovzxbd ymm1, [rdi] reads 8 bytes and widens each to a dword: 8 palette indexes. vpgatherdd ymm0, [rcx + ymm1*4], ymm2 loads palette[index] for each lane whose mask (ymm2) has its top bit set, and clears the mask as it goes, so set it to all-ones (vpcmpeqd ymm2, ymm2, ymm2) before every gather.",
  "The 8 colours are in sprite order; on the screen they go backwards. vpermd ymm0, ymm_idx, ymm0 sets lane i to lane idx[i] of ymm0: with idx = 7, 6, ..., 0 (a constant in .rodata) that reverses them, across the two 128-bit halves (which vpshufd and vpshufb can't cross).",
  "Write each reversed block of 8 just below the previous one, starting from dst + 4n and going down. The last n % 8 pixels: a scalar loop, continuing downward. vzeroupper before returning.",
]

