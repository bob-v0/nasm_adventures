<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" font-family="sans-serif" font-size="14">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs>
<rect width="720" height="340" fill="#ffffff"/>
<text x="360" y="22" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">The shape of an x86-64 instruction</text>
<rect x="40.0" y="36" width="90" height="40" fill="#eeeeee" stroke="#222" stroke-dasharray="5,4"/>
<text x="85.0" y="61.0" font-size="13" text-anchor="middle" fill="#222">prefixes</text>
<text x="85.0" y="94" font-size="12" text-anchor="middle" fill="#555">optional</text>
<rect x="130.0" y="36" width="60" height="40" fill="#eeeeee" stroke="#222" stroke-dasharray="5,4"/>
<text x="160.0" y="61.0" font-size="13" text-anchor="middle" fill="#222">REX</text>
<text x="160.0" y="94" font-size="12" text-anchor="middle" fill="#555">0–1 bytes</text>
<rect x="190.0" y="36" width="80" height="40" fill="#f4c7c3" stroke="#222"/>
<text x="230.0" y="61.0" font-size="13" text-anchor="middle" fill="#222">opcode</text>
<text x="230.0" y="94" font-size="12" text-anchor="middle" fill="#555">1–3 bytes</text>
<rect x="270.0" y="36" width="80" height="40" fill="#c9daf8" stroke="#222" stroke-dasharray="5,4"/>
<text x="310.0" y="61.0" font-size="13" text-anchor="middle" fill="#222">ModRM</text>
<text x="310.0" y="94" font-size="12" text-anchor="middle" fill="#555">0–1 bytes</text>
<rect x="350.0" y="36" width="70" height="40" fill="#fff2cc" stroke="#222" stroke-dasharray="5,4"/>
<text x="385.0" y="61.0" font-size="13" text-anchor="middle" fill="#222">SIB</text>
<text x="385.0" y="94" font-size="12" text-anchor="middle" fill="#555">0–1 bytes</text>
<rect x="420.0" y="36" width="130" height="40" fill="#d9ead3" stroke="#222" stroke-dasharray="5,4"/>
<text x="485.0" y="61.0" font-size="13" text-anchor="middle" fill="#222">displacement</text>
<text x="485.0" y="94" font-size="12" text-anchor="middle" fill="#555">0, 1, 2, 4 bytes</text>
<rect x="550.0" y="36" width="130" height="40" fill="#d9ead3" stroke="#222" stroke-dasharray="5,4"/>
<text x="615.0" y="61.0" font-size="13" text-anchor="middle" fill="#222">immediate</text>
<text x="615.0" y="94" font-size="12" text-anchor="middle" fill="#555">0, 1, 2, 4 (8) bytes</text>
<text x="360" y="116" font-size="13" text-anchor="middle" fill="#555">Only the opcode is always there; dashed parts depend on it.</text>
<text x="20" y="148" font-size="14" text-anchor="start" fill="#222" font-weight="bold" font-family="monospace">Example:  mov [rsp-8], eax  =  89 44 24 F8</text>
<rect x="190.0" y="158" width="80" height="30" fill="#ffffff" stroke="#222"/>
<text x="230.0" y="178.0" font-size="14" text-anchor="middle" fill="#222" font-family="monospace">89</text>
<rect x="270.0" y="158" width="80" height="30" fill="#ffffff" stroke="#222"/>
<text x="310.0" y="178.0" font-size="14" text-anchor="middle" fill="#222" font-family="monospace">44</text>
<rect x="350.0" y="158" width="70" height="30" fill="#ffffff" stroke="#222"/>
<text x="385.0" y="178.0" font-size="14" text-anchor="middle" fill="#222" font-family="monospace">24</text>
<rect x="420.0" y="158" width="130" height="30" fill="#ffffff" stroke="#222"/>
<text x="485.0" y="178.0" font-size="14" text-anchor="middle" fill="#222" font-family="monospace">F8</text>
<text x="40" y="222" font-size="13" text-anchor="start" fill="#222" font-weight="bold">ModRM = 0x44</text>
<rect x="40" y="230" width="90" height="30" fill="#ffffff" stroke="#222"/>
<text x="85.0" y="250.0" font-size="14" text-anchor="middle" fill="#222" font-family="monospace">01</text>
<text x="85.0" y="276" font-size="12" text-anchor="middle" fill="#555">mod (7–6)</text>
<text x="85.0" y="292" font-size="12" text-anchor="middle" fill="#222">disp8 follows</text>
<rect x="130" y="230" width="100" height="30" fill="#ffffff" stroke="#222"/>
<text x="180.0" y="250.0" font-size="14" text-anchor="middle" fill="#222" font-family="monospace">000</text>
<text x="180.0" y="276" font-size="12" text-anchor="middle" fill="#555">reg (5–3)</text>
<text x="180.0" y="292" font-size="12" text-anchor="middle" fill="#222">eax</text>
<rect x="230" y="230" width="100" height="30" fill="#ffffff" stroke="#222"/>
<text x="280.0" y="250.0" font-size="14" text-anchor="middle" fill="#222" font-family="monospace">100</text>
<text x="280.0" y="276" font-size="12" text-anchor="middle" fill="#555">r/m (2–0)</text>
<text x="280.0" y="292" font-size="12" text-anchor="middle" fill="#222">4: SIB follows</text>
<text x="390" y="222" font-size="13" text-anchor="start" fill="#222" font-weight="bold">SIB = 0x24</text>
<rect x="390" y="230" width="90" height="30" fill="#ffffff" stroke="#222"/>
<text x="435.0" y="250.0" font-size="14" text-anchor="middle" fill="#222" font-family="monospace">00</text>
<text x="435.0" y="276" font-size="12" text-anchor="middle" fill="#555">scale (7–6)</text>
<text x="435.0" y="292" font-size="12" text-anchor="middle" fill="#222">× 1</text>
<rect x="480" y="230" width="100" height="30" fill="#ffffff" stroke="#222"/>
<text x="530.0" y="250.0" font-size="14" text-anchor="middle" fill="#222" font-family="monospace">100</text>
<text x="530.0" y="276" font-size="12" text-anchor="middle" fill="#555">index (5–3)</text>
<text x="530.0" y="292" font-size="12" text-anchor="middle" fill="#222">4: no index</text>
<rect x="580" y="230" width="100" height="30" fill="#ffffff" stroke="#222"/>
<text x="630.0" y="250.0" font-size="14" text-anchor="middle" fill="#222" font-family="monospace">100</text>
<text x="630.0" y="276" font-size="12" text-anchor="middle" fill="#555">base (2–0)</text>
<text x="630.0" y="292" font-size="12" text-anchor="middle" fill="#222">rsp</text>
<text x="360" y="324" font-size="13" text-anchor="middle" fill="#222">address = base + index × 2^scale + disp = rsp + (−8);   disp8 F8 = −8</text>
</svg>
