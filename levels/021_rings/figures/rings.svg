<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" width="720" height="230" role="img">
<title>The kernel drops to ring 3 with iretq; the program comes back with int 0x80 onto the RSP0 stack</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker></defs>
<rect x="0" y="0" width="720" height="230" fill="#ffffff"/>
<rect x="20" y="20" width="680" height="70" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="40" y="48" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">ring 0: the kernel</text>
<text x="40" y="70" font-family="sans-serif" font-size="12" fill="#555555">its stack: RSP0 (in the TSS) · all pages · cli, hlt, mov cr3…</text>
<rect x="20" y="140" width="680" height="70" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
<text x="40" y="168" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">ring 3: the program</text>
<text x="40" y="190" font-family="sans-serif" font-size="12" fill="#555555">its own stack · only pages with U at every level · no privileged instructions</text>
<path d="M470,90 L470,138" stroke="#555555" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="480" y="112" font-family="monospace" font-size="12" fill="#222222">iretq</text>
<text x="480" y="127" font-family="sans-serif" font-size="11" fill="#555555">frame: ss 0x1b, rsp, rflags, cs 0x23, rip</text>
<path d="M330,140 L330,92" stroke="#555555" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="320" y="112" font-family="monospace" font-size="12" text-anchor="end" fill="#222222">int 0x80</text>
<text x="320" y="127" font-family="sans-serif" font-size="11" text-anchor="end" fill="#555555">a DPL 3 gate; the CPU switches to RSP0</text>
</svg>
