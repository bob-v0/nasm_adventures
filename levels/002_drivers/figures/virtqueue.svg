<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 230" width="740" height="230" role="img">
<title>A virtio request: three descriptors offered in the available ring and returned in the used ring</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker></defs>
<rect x="0" y="0" width="740" height="230" fill="#ffffff"/>
<rect x="230" y="40" width="140" height="46" rx="5" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="300" y="60" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#222222">header</text>
<text x="300" y="77" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#555555">read, sector</text>
<path d="M370,63 L388,63" stroke="#555555" stroke-width="1.3" marker-end="url(#arr)"/>
<rect x="390" y="40" width="140" height="46" rx="5" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/>
<text x="460" y="60" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#222222">buffer</text>
<text x="460" y="77" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#555555">the device writes</text>
<path d="M530,63 L548,63" stroke="#555555" stroke-width="1.3" marker-end="url(#arr)"/>
<rect x="550" y="40" width="140" height="46" rx="5" fill="#ffedd5" stroke="#c2410c" stroke-width="1.4"/>
<text x="620" y="60" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#222222">status</text>
<text x="620" y="77" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#555555">0 = ok</text>
<text x="230" y="30" font-family="sans-serif" font-size="12" fill="#555555">descriptors 0 → 1 → 2 (NEXT)</text>
<rect x="20" y="130" width="190" height="40" rx="5" fill="#eeeeee" stroke="#888888"/>
<text x="115" y="155" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#222222">available ring: 0, idx++</text>
<rect x="530" y="130" width="190" height="40" rx="5" fill="#eeeeee" stroke="#888888"/>
<text x="625" y="155" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#222222">used ring: idx++</text>
<path d="M115,128 L235,90" stroke="#555555" stroke-width="1.3" marker-end="url(#arr)"/>
<path d="M600,90 L620,126" stroke="#555555" stroke-width="1.3" marker-end="url(#arr)"/>
<text x="250" y="158" font-family="monospace" font-size="11" fill="#1d4ed8">driver: notify →</text>
<text x="400" y="158" font-family="monospace" font-size="11" fill="#15803d">← device: MSI-X</text>
<text x="20" y="216" font-family="sans-serif" font-size="12" fill="#555555">The driver offers a chain, the device uses it, writes the buffer and status, then interrupts.</text>
</svg>
