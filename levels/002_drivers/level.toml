hints = [
  "find_disk: on bus 0, function 0 of each device, the dword at 0 is device << 16 | vendor: 0x10011AF4. BAR 0 (offset 0x10) & ~3 is its I/O ports ([io]). Set the command register's (offset 4) bits 0-2 (I/O, memory, bus mastering: the device writes memory itself). Then MSI-X: follow the capability list (offset 0x34; each capability: id, next) to id 0x11; at +4, the table's BAR (low 3 bits) and offset; entry 0 (16 bytes): address 0xFEE00000, 0, data DISK_VECTOR, 0 (unmasked); then set bit 31 of the capability's first dword (enable).",
  "virtio_init, legacy registers from [io]: status (+18, a byte): 0, 1, 3 (reset, acknowledge, driver); guest features (+4) = 0; queue select (+14) = 0; its size (+12, a word) gives the layout: 16 bytes per descriptor, then the available ring (flags, idx, a word per entry); the used ring starts at the next 4096 boundary. queue 0's MSI-X entry (+22) = 0, configuration's (+20) = 0xFFFF; the queue's page number (+8) = queue >> 12; status 7 (driver ok).",
  "read_sectors: three descriptors (address qword, length dword, flags word, next word): the 16-byte header {type 0 = read, 0, sector qword}, flags NEXT (1) next 1; the data, flags NEXT | WRITE (3) next 2; the status byte, WRITE. Put 0 (the chain's head) in the available ring at idx mod size, then increment idx; count the request; write 0 to notify (+16). Then cli / compare completions with requests / sti; hlt until done. disk_irq: advance [seen_used] to the used ring's idx (+2), counting completions; EOI.",
]

