<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 250" width="740" height="250" role="img">
<title>Four CPUs share one scheduler and one lock; each has its own idle task and per-CPU data</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker></defs>
<rect x="0" y="0" width="740" height="250" fill="#ffffff"/>
<rect x="20" y="20" width="160" height="70" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="100" y="42" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#222222">CPU 0</text>
<text x="100" y="60" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#555555">gs: its data · its TSS</text>
<text x="100" y="76" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#555555">its idle task</text>
<path d="M100,92 L370,138" stroke="#555555" stroke-width="1.2" marker-end="url(#arr)"/>
<rect x="200" y="20" width="160" height="70" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="280" y="42" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#222222">CPU 1</text>
<text x="280" y="60" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#555555">gs: its data · its TSS</text>
<text x="280" y="76" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#555555">its idle task</text>
<path d="M280,92 L370,138" stroke="#555555" stroke-width="1.2" marker-end="url(#arr)"/>
<rect x="380" y="20" width="160" height="70" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="460" y="42" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#222222">CPU 2</text>
<text x="460" y="60" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#555555">gs: its data · its TSS</text>
<text x="460" y="76" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#555555">its idle task</text>
<path d="M460,92 L370,138" stroke="#555555" stroke-width="1.2" marker-end="url(#arr)"/>
<rect x="560" y="20" width="160" height="70" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="640" y="42" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#222222">CPU 3</text>
<text x="640" y="60" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#555555">gs: its data · its TSS</text>
<text x="640" y="76" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#555555">its idle task</text>
<path d="M640,92 L370,138" stroke="#555555" stroke-width="1.2" marker-end="url(#arr)"/>
<rect x="220" y="140" width="300" height="46" rx="6" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5"/>
<text x="370" y="160" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#222222">the kernel lock</text>
<text x="370" y="177" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#555555">tasks, files, pipes, frames: one CPU at a time</text>
<text x="20" y="220" font-family="sans-serif" font-size="12" fill="#555555">Taken on every way in from ring 3, released on every way out; a task that blocks hands it,</text>
<text x="20" y="238" font-family="sans-serif" font-size="12" fill="#555555">through switch_to, to whatever runs next on that CPU. Programs themselves run on all CPUs at once.</text>
</svg>
