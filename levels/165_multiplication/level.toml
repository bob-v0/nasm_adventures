level = 165
slug = "multiplication"
title = "Multiplication"
arc = "II"
mode = "fragment"
concepts = ["mul: unsigned, 128-bit result in rdx:rax", "imul's three forms", "overflow flags after multiplication", "implicit operands"]
introduces = ["mul", "imul r/m", "imul r, r/m", "imul r, r/m, imm"]

hints = [
  "`mul rsi` multiplies rax by rsi and puts the 128-bit result in rdx:rax, so load a into rax first. It overwrites rdx, so do it last (or save what you need first).",
  "Two-operand `imul r10, rsi` keeps only the low 64 bits and sets OF (and CF) when the signed result didn't fit. Turn that into 0/1 with a jump or the `adc` trick.",
  """Do the `mul` last, because it overwrites rdx:

```
imul r9, rdi, 37        ; three operands: r9 = a * 37
mov r10, rdi
imul r10, rsi           ; low 64 bits; OF = CF = 1 if the signed product didn't fit
mov r8d, 0              ; mov, not xor: it leaves CF alone
adc r8, 0               ; r8 = 0 + 0 + CF
mov rax, rdi
mul rsi                 ; rdx:rax = the full unsigned product
```""",
]

[constraints]
max_instructions = 14
must_use = ["mul", "imul"]
preserve = ["rsp", "rdi", "rsi"]
max_steps = 1000

[random]
count = 80

[[tests]]
name = "3 x 5"
regs = { rdi = 3, rsi = 5 }
[tests.expect]
regs = { rax = 15, rdx = 0, r8 = 0, r9 = 111, r10 = 15 }

[[tests]]
name = "2^63 x 2"
regs = { rdi = "0x8000000000000000", rsi = 2 }
[tests.expect]
regs = { rax = 0, rdx = 1, r8 = 1, r9 = "0x8000000000000000", r10 = 0 }
