hints = [
  "Struct: capacity, head, count, closed, then a queue of waiting senders and one of waiting receivers (task pointers from rt_current), then the ring buffer. The value goes in at buf[(head + count) % cap]; the oldest is at buf[head].",
  "Waiting: append rt_current() to the right queue, then rt_park(). The other side, after changing the channel, takes the first task from that queue and rt_unparks it. Do nothing that awaits between checking and parking.",
  "After waking, LOOK AGAIN (a loop, not an if): another task may have filled the free slot first. chan_close sets the flag and unparks every waiting receiver; chan_recv returns rdx = 0 when the channel is empty and closed.",
]

