level = 182
slug = "literals"
title = "Speaking in Numbers"
arc = "I"
mode = "fragment"
concepts = ["binary, octal, decimal, hexadecimal", "NASM numeric constants", "character constants", "two's complement (preview)"]
introduces = ["0x / h / 0b / 0o / q literals", "underscores in numbers", "'char' constants", "mov r64, imm64"]

hints = [
  "Every way NASM can write a number is listed in {{docs literals}}. You don't need to convert anything by hand.",
  "rax: write 0b1010_1010 eight times in a row (64 bits). rbx: 'NASM' in single quotes is a number. rcx: -1.",
  "mov rax, 0b10101010_10101010_10101010_10101010_10101010_10101010_10101010_10101010\nmov rbx, 'NASM'\nmov rcx, -1\nmov rdx, 0o755\nmov rsi, 1_000_000_000_000\nmov rdi, 0BEEFh",
]

[constraints]
max_instructions = 6
must_use = ["mov"]
max_steps = 1000

[[tests]]
name = "six numbers"
[tests.expect]
regs = { rax = "0xAAAA_AAAA_AAAA_AAAA", rbx = "0x4D53_414E", rcx = "0xFFFF_FFFF_FFFF_FFFF", rdx = 493, rsi = 1000000000000, rdi = "0xBEEF" }
