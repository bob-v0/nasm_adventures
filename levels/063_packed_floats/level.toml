level = 63
slug = "packed_floats"
title = "Packed Floats"
arc = "IX"
mode = "function"
entry = "ring_dot"
perf = true
concepts = ["packed single precision: four floats per xmm register", "mulps, addps: four operations per instruction", "horizontal sums: adding the lanes of one register", "several accumulators to hide addps's latency", "aligned loads and the order of additions"]
introduces = ["movaps / movups", "mulps / addps / subps / divps", "movhlps / shufps / haddps", "multiple vector accumulators", "float summation order"]

hints = [
  "Four floats per register: movaps xmm1, [rdi] / mulps xmm1, [rsi] / addps xmm0, xmm1 handles 4 elements. Lane i of xmm0 then holds the sum of every 4th product; at the end, add the 4 lanes together.",
  "addps has a latency of 4 cycles, so one accumulator can only take one addps every 4 cycles: 1 cycle per element. Use four accumulators (xmm0-xmm3) for 16 elements per iteration, and add them together after the loop (level 98 did this with addsd).",
  "Horizontal sum of xmm0: movhlps xmm1, xmm0 (the high two floats to the low half) / addps xmm0, xmm1 / movaps xmm1, xmm0 / shufps xmm1, xmm1, 1 (float 1 to position 0) / addss xmm0, xmm1. Then the remaining n % 16 elements with mulss/addss.",
]

[constraints]
max_steps = 300000

