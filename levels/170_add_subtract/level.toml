level = 170
slug = "add_subtract"
title = "Add & Subtract"
arc = "II"
mode = "fragment"
concepts = ["add, sub, inc, dec, neg", "arithmetic is modulo 2^64", "two-operand form: dest = dest op src"]
introduces = ["add", "sub", "inc", "dec", "neg"]

hints = [
  "x86 arithmetic is two-operand: `add rax, rsi` means rax = rax + rsi. Copy an input into the output register first, then operate on the copy.",
  "Don't modify rdi, rsi or rdx; they must still hold the inputs at the end. `neg` turns x into -x (0 - x).",
  "mov rax, rdi / add rax, rsi / sub rax, rdx — then mov rbx, rdi / neg rbx — mov rcx, rdx / inc rcx — mov r8, rsi / dec r8 — mov r9, rdx / sub r9, rdi / sub r9, rdi",
]

[constraints]
max_instructions = 14
banned = ["lea", "imul", "mul"]
preserve = ["rsp", "rdi", "rsi", "rdx"]
max_steps = 1000

[random]
count = 50

[[tests]]
name = "a=10, b=20, c=5"
regs = { rdi = 10, rsi = 20, rdx = 5 }
[tests.expect]
regs = { rax = 25, rbx = "0xFFFFFFFFFFFFFFF6", rcx = 6, r8 = 19, r9 = "0xFFFFFFFFFFFFFFF1" }

[[tests]]
name = "wrap-around: a = 2^64 - 1"
regs = { rdi = "0xFFFFFFFFFFFFFFFF", rsi = 1, rdx = 0 }
[tests.expect]
regs = { rax = 0, rbx = 1, rcx = 1, r8 = 0, r9 = 2 }
