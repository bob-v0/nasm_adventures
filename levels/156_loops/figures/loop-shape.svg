<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" width="560" height="420" role="img">
<title>A loop: init, test, body, step, and back to the test</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker></defs>
<rect x="0" y="0" width="560" height="420" fill="#ffffff"/>
<rect x="170" y="20" width="220" height="50" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="280" y="41" font-family="sans-serif" font-size="14" xml:space="preserve" text-anchor="middle" font-weight="bold" fill="#222222">init</text>
<text x="280" y="60" font-family="monospace" font-size="13" xml:space="preserve" text-anchor="middle" font-weight="normal" fill="#6b7280">xor ecx, ecx</text>
<line x1="280" y1="70" x2="280" y2="98" stroke="#222222" stroke-width="1.5" marker-end="url(#arr)"/>
<polygon points="280,100 390,145 280,190 170,145" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5"/>
<text x="280" y="140" font-family="sans-serif" font-size="14" xml:space="preserve" text-anchor="middle" font-weight="bold" fill="#222222">test: i &lt; n ?</text>
<text x="280" y="158" font-family="monospace" font-size="13" xml:space="preserve" text-anchor="middle" font-weight="normal" fill="#6b7280">cmp rcx, rsi</text>
<line x1="280" y1="190" x2="280" y2="218" stroke="#222222" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="290" y="210" font-family="sans-serif" font-size="13" xml:space="preserve" text-anchor="start" font-weight="normal" fill="#15803d">yes</text>
<rect x="170" y="220" width="220" height="50" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
<text x="280" y="241" font-family="sans-serif" font-size="14" xml:space="preserve" text-anchor="middle" font-weight="bold" fill="#222222">body</text>
<text x="280" y="260" font-family="monospace" font-size="13" xml:space="preserve" text-anchor="middle" font-weight="normal" fill="#6b7280">the work</text>
<line x1="280" y1="270" x2="280" y2="298" stroke="#222222" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="170" y="300" width="220" height="50" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
<text x="280" y="321" font-family="sans-serif" font-size="14" xml:space="preserve" text-anchor="middle" font-weight="bold" fill="#222222">step</text>
<text x="280" y="340" font-family="monospace" font-size="13" xml:space="preserve" text-anchor="middle" font-weight="normal" fill="#6b7280">inc rcx</text>
<path d="M 170 325 L 100 325 L 100 145 L 168 145" fill="none" stroke="#222222" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="92" y="236" font-family="monospace" font-size="13" xml:space="preserve" text-anchor="end" font-weight="normal" fill="#222222">jmp .top</text>
<path d="M 390 145 L 470 145 L 470 378" fill="none" stroke="#222222" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="400" y="136" font-family="monospace" font-size="13" xml:space="preserve" text-anchor="start" font-weight="normal" fill="#c2410c">no: jae .done</text>
<rect x="420" y="380" width="100" height="32" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="470" y="401" font-family="sans-serif" font-size="14" xml:space="preserve" text-anchor="middle" font-weight="bold" fill="#222222">done</text>
<text x="20" y="408" font-family="sans-serif" font-size="13" xml:space="preserve" text-anchor="start" font-weight="normal" fill="#6b7280">If n = 0 the test fails at once and the body never runs.</text>
</svg>
