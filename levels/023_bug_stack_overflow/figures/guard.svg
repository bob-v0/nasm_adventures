<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" role="img">
<title>Without a guard page the stack overflows into squares; with one, the overflow faults</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b8322a"/></marker></defs>
<rect x="0" y="0" width="720" height="320" fill="#ffffff"/>
<text x="160" y="30" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">before</text>
<rect x="60" y="44" width="200" height="110" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="160" y="99.0" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#222222">stack</text>
<text x="160" y="115.0" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#555555">16 KiB, grows down</text>
<rect x="60" y="154" width="200" height="50" fill="#f6d0cc" stroke="#b8322a" stroke-width="1.5"/>
<text x="160" y="179.0" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#222222">squares</text>
<text x="160" y="195.0" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#555555">overwritten, silently</text>
<rect x="60" y="204" width="200" height="50" fill="#eeeeee" stroke="#888888" stroke-width="1.5"/>
<text x="160" y="234.0" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#222222">scratch</text>
<text x="500" y="30" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">with a guard page</text>
<rect x="400" y="44" width="200" height="110" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="500" y="99.0" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#222222">stack</text>
<text x="500" y="115.0" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#555555">16 KiB, grows down</text>
<rect x="400" y="154" width="200" height="50" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5" stroke-dasharray="5,4"/>
<text x="500" y="179.0" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#222222">guard page</text>
<text x="500" y="195.0" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#555555">not mapped: #PF → #DF</text>
<rect x="400" y="204" width="200" height="50" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
<text x="500" y="229.0" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#222222">squares</text>
<text x="500" y="245.0" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#555555">untouched</text>
<path d="M40,60 L40,190" stroke="#b8322a" stroke-width="2" marker-end="url(#arr)"/>
<text x="34" y="120" font-family="sans-serif" font-size="11" text-anchor="end" fill="#b8322a" transform="rotate(-90 34 120)">deep recursion</text>
<path d="M380,60 L380,190" stroke="#b8322a" stroke-width="2" marker-end="url(#arr)"/>
<text x="374" y="120" font-family="sans-serif" font-size="11" text-anchor="end" fill="#b8322a" transform="rotate(-90 374 120)">deep recursion</text>
<text x="30" y="288" font-family="sans-serif" font-size="12" fill="#555555">Higher addresses at the top. The page fault happens on the broken stack, so it can't be delivered there:</text>
<text x="30" y="305" font-family="sans-serif" font-size="12" fill="#555555">it becomes a #DF, and the #DF gate's IST stack (level 24) is where the report runs.</text>
</svg>
