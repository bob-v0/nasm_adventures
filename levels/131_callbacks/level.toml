  "A function pointer is an address: `call rdx` calls whatever function rdx points to. But the callback destroys rdx (and every other scratch register), so keep the pointer, the array, n and your index in callee-saved registers.",
  "filter compacts in place: a 'write' index trails a 'read' index; when pred(arr[read]) is non-zero, arr[write++] = arr[read]. Return write. It's stable: kept elements stay in order.",
