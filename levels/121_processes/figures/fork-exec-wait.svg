<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" width="700" height="330" font-family="sans-serif" font-size="14">
  <defs>
    <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="700" height="330" fill="#fff"/>
  <text x="20" y="22" font-size="13" fill="#555">time →</text>
  <!-- parent lane -->
  <text x="20" y="64" font-weight="bold">parent</text>
  <line x1="90" y1="80" x2="170" y2="80" stroke="#1f6fb2" stroke-width="4"/>
  <circle cx="170" cy="80" r="7" fill="#1f6fb2"/>
  <text x="170" y="60" text-anchor="middle" font-family="monospace">fork()</text>
  <line x1="170" y1="80" x2="330" y2="80" stroke="#1f6fb2" stroke-width="4"/>
  <text x="250" y="104" text-anchor="middle" font-size="13" fill="#1f6fb2">rax = child's pid</text>
  <circle cx="330" cy="80" r="7" fill="#1f6fb2"/>
  <text x="330" y="60" text-anchor="middle" font-family="monospace">wait4(pid, ...)</text>
  <line x1="330" y1="80" x2="580" y2="80" stroke="#1f6fb2" stroke-width="2" stroke-dasharray="6,5"/>
  <text x="462" y="104" text-anchor="middle" font-size="13" fill="#555">asleep until the child ends</text>
  <circle cx="580" cy="80" r="7" fill="#1f6fb2"/>
  <line x1="580" y1="80" x2="680" y2="80" stroke="#1f6fb2" stroke-width="4"/>
  <text x="600" y="60" text-anchor="middle" font-size="13">returns pid</text>
  <text x="630" y="104" text-anchor="middle" font-size="13" fill="#1f6fb2">status = 3 &lt;&lt; 8</text>
  <!-- fork branch -->
  <path d="M170,80 C170,150 190,200 220,200" fill="none" stroke="#1f6fb2" stroke-width="4"/>
  <!-- child lane: copy of your program -->
  <text x="20" y="196" font-weight="bold">child</text>
  <line x1="220" y1="200" x2="310" y2="200" stroke="#1f6fb2" stroke-width="4"/>
  <text x="250" y="226" text-anchor="middle" font-size="13" fill="#1f6fb2">rax = 0</text>
  <text x="250" y="243" text-anchor="middle" font-size="13" fill="#1f6fb2">(your code)</text>
  <circle cx="310" cy="200" r="7" fill="#b35900"/>
  <text x="310" y="180" text-anchor="middle" font-family="monospace">execve("/bin/exit3")</text>
  <!-- child lane: new program -->
  <line x1="310" y1="200" x2="490" y2="200" stroke="#b35900" stroke-width="4"/>
  <text x="400" y="226" text-anchor="middle" font-size="13" fill="#b35900">exit3's code, same pid</text>
  <circle cx="490" cy="200" r="7" fill="#b35900"/>
  <text x="490" y="180" text-anchor="middle" font-family="monospace">exit(3)</text>
  <!-- zombie -->
  <line x1="490" y1="200" x2="580" y2="200" stroke="#999" stroke-width="2" stroke-dasharray="2,4"/>
  <text x="535" y="226" text-anchor="middle" font-size="13" fill="#777">zombie</text>
  <path d="M580,196 L580,90" stroke="#333" stroke-width="1.5" marker-end="url(#k)"/>
  <text x="588" y="150" font-size="13" fill="#333">wait4 collects</text>
  <text x="588" y="166" font-size="13" fill="#333">the status</text>
  <!-- legend -->
  <line x1="20" y1="290" x2="60" y2="290" stroke="#1f6fb2" stroke-width="4"/>
  <text x="68" y="295" font-size="13">your program</text>
  <line x1="190" y1="290" x2="230" y2="290" stroke="#b35900" stroke-width="4"/>
  <text x="238" y="295" font-size="13">the program execve loaded</text>
  <line x1="440" y1="290" x2="480" y2="290" stroke="#999" stroke-width="2" stroke-dasharray="2,4"/>
  <text x="488" y="295" font-size="13">ended, not yet waited for</text>
</svg>
