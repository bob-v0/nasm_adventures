hints = [
  "fork() returns twice: 0 in the child, the child's pid in the parent. Right after it, `test rax, rax` / `jz .child` splits the two paths.",
  "The child: execve(path, argv, envp) with argv = [path, 0]. Build that two-word array in .bss. envp is the one you got: it starts at [rsp + 8*argc + 16] at _start. If execve returns at all, it failed: write the error line to stderr and exit(127).",
  "The parent: wait4(pid, &status, 0, 0). If (status & 0x7f) == 0 the child exited and its code is (status >> 8) & 0xff; otherwise it was killed by signal (status & 0x7f).",
]

