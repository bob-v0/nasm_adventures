<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" width="700" height="340" font-family="sans-serif" font-size="14">
  <defs>
    <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b35900"/>
    </marker>
  </defs>
  <rect width="700" height="340" fill="#fff"/>
  <!-- sockets -->
  <text x="20" y="26" font-weight="bold">sockets</text>
  <rect x="20" y="40" width="100" height="40" rx="6" fill="#f4f4f4" stroke="#555"/><text x="70" y="65" text-anchor="middle" font-size="13">client fd 5</text>
  <rect x="20" y="110" width="100" height="40" rx="6" fill="#f4f4f4" stroke="#555"/><text x="70" y="135" text-anchor="middle" font-size="13">client fd 6</text>
  <rect x="20" y="180" width="100" height="40" rx="6" fill="#f4f4f4" stroke="#555"/><text x="70" y="205" text-anchor="middle" font-size="13">client fd 7</text>
  <!-- readers -->
  <text x="170" y="26" font-weight="bold">reader actors</text>
  <rect x="170" y="40" width="110" height="40" rx="20" fill="#e3effa" stroke="#1f6fb2"/><text x="225" y="65" text-anchor="middle" font-size="13">reader(5)</text>
  <rect x="170" y="110" width="110" height="40" rx="20" fill="#e3effa" stroke="#1f6fb2"/><text x="225" y="135" text-anchor="middle" font-size="13">reader(6)</text>
  <rect x="170" y="180" width="110" height="40" rx="20" fill="#e3effa" stroke="#1f6fb2"/><text x="225" y="205" text-anchor="middle" font-size="13">reader(7)</text>
  <g stroke="#333" stroke-width="1.5">
    <path d="M120,60 L166,60" marker-end="url(#k)"/>
    <path d="M120,130 L166,130" marker-end="url(#k)"/>
    <path d="M120,200 L166,200" marker-end="url(#k)"/>
  </g>
  <text x="143" y="98" text-anchor="middle" font-size="12" fill="#555">read</text>
  <!-- mailbox -->
  <text x="350" y="26" font-weight="bold">room's mailbox</text>
  <rect x="350" y="70" width="130" height="120" rx="6" fill="#fdebd3" stroke="#b35900"/>
  <g font-size="12" font-family="monospace">
    <rect x="360" y="80" width="110" height="26" fill="#fff" stroke="#b35900"/><text x="415" y="98" text-anchor="middle">SAY, from 6</text>
    <rect x="360" y="114" width="110" height="26" fill="#fff" stroke="#b35900"/><text x="415" y="132" text-anchor="middle">JOIN, from 7</text>
    <rect x="360" y="148" width="110" height="26" fill="#fff" stroke="#b35900"/><text x="415" y="166" text-anchor="middle">LEAVE, from 5</text>
  </g>
  <text x="415" y="210" text-anchor="middle" font-size="12" fill="#555">oldest first</text>
  <g stroke="#b35900" stroke-width="1.5">
    <path d="M280,60 L346,122" marker-end="url(#o)"/>
    <path d="M280,130 L346,130" marker-end="url(#o)"/>
    <path d="M280,200 L346,138" marker-end="url(#o)"/>
  </g>
  <text x="313" y="232" text-anchor="middle" font-size="12" fill="#b35900">mb_send</text>
  <!-- room -->
  <text x="540" y="26" font-weight="bold">room actor</text>
  <rect x="540" y="70" width="140" height="120" rx="12" fill="#e3effa" stroke="#1f6fb2" stroke-width="2"/>
  <text x="610" y="100" text-anchor="middle" font-size="13">members[ ]:</text>
  <text x="610" y="120" text-anchor="middle" font-size="13" font-family="monospace">5, 6</text>
  <text x="610" y="148" text-anchor="middle" font-size="12" fill="#555">one message</text>
  <text x="610" y="164" text-anchor="middle" font-size="12" fill="#555">at a time</text>
  <path d="M480,130 L536,130" stroke="#b35900" stroke-width="1.5" marker-end="url(#o)"/>
  <text x="508" y="122" text-anchor="middle" font-size="12" fill="#b35900">mb_recv</text>
  <!-- writes back -->
  <path d="M610,192 C610,290 70,300 70,224" fill="none" stroke="#1f6fb2" stroke-width="2" marker-end="url(#k)"/>
  <text x="340" y="300" text-anchor="middle" font-size="13" fill="#1f6fb2">only the room writes to sockets (and closes them after LEAVE)</text>
</svg>
