  "REX = 0100 W R X B: W = 64-bit operand, R extends ModRM.reg, X extends SIB.index, B extends ModRM.r/m (or SIB.base, or the register in the opcode). mov r9, rax is 89 /r with r/m = r9 (1 + B) and reg = rax: REX = 0x49 (W and B), ModRM 11 000 001.",
  "Prefixes come first, then REX, then the opcode: lock xadd [rsp−16], r12d is F0, then REX.R (0x44: r12 is reg 4 + R), then 0F C1 /r. SSE instructions are a prefix + 0F + opcode: 66 for packed integers and pd, F3 for ss and movdqu, F2 for sd; the prefix is part of the opcode, and REX still comes after it (F2 49 0F 2A CC).",
  "VEX replaces REX and the prefix: C5 [R̄ v̄v̄v̄v̄ L pp] opcode, where R̄ and vvvv are stored INVERTED, vvvv is the extra source register, L = 1 for 256 bits, pp = 0/1/2/3 for none/66/F3/F2. The 3-byte form C4 [R̄ X̄ B̄ mmmmm] [W v̄v̄v̄v̄ L pp] is needed when X or B are set (registers 8-15 in r/m) or the map isn't 0F.",
