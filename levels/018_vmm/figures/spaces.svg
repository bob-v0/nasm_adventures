<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 250" width="740" height="250" role="img">
<title>Two address spaces: private low halves, one shared kernel half</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker></defs>
<rect x="0" y="0" width="740" height="250" fill="#ffffff"/>
<text x="110" y="26" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#222222">process A's PML4</text>
<rect x="30" y="36" width="160" height="60" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
<text x="110" y="62" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#222222">entries 0-255</text>
<text x="110" y="80" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#555555">its own: 0x400000…</text>
<rect x="30" y="96" width="160" height="60" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="110" y="122" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#222222">entries 256-511</text>
<text x="110" y="140" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#555555">copied from the kernel</text>
<path d="M190,126 C 215,190 470,190 520,140" fill="none" stroke="#555555" stroke-width="1.3" marker-end="url(#arr)"/>
<text x="330" y="26" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#222222">process B's PML4</text>
<rect x="250" y="36" width="160" height="60" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
<text x="330" y="62" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#222222">entries 0-255</text>
<text x="330" y="80" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#555555">its own: 0x400000…</text>
<rect x="250" y="96" width="160" height="60" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="330" y="122" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#222222">entries 256-511</text>
<text x="330" y="140" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#555555">copied from the kernel</text>
<path d="M410,126 L520,126" stroke="#555555" stroke-width="1.3" marker-end="url(#arr)"/>
<rect x="522" y="96" width="190" height="60" rx="5" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="617" y="118" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#222222">the kernel's tables</text>
<text x="617" y="136" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#555555">higher half · direct map</text>
<text x="30" y="210" font-family="sans-serif" font-size="12" fill="#555555">mov cr3 switches the low half; the kernel half looks the same from every space.</text>
<text x="30" y="228" font-family="sans-serif" font-size="12" fill="#555555">Physical memory, from any space: DIRECT + x. (And the kernel's first 4 MiB stay mapped, supervisor-only.)</text>
</svg>
