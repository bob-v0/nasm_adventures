concepts = ["cross-modifying code: one thread changes code another is running", "patching an instruction atomically: one aligned store", "a thread can still be inside the old code after the patch", "safepoints and quiescence before reusing code memory", "store buffers delay a patch too (mfence)", "serializing the executing CPU, on real hardware"]
