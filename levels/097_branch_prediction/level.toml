hints = [
  "On random bytes, `jb .skip` goes one way or the other at random: the predictor is right half the time, and each wrong guess costs 15 cycles. The report counts the mispredictions.",
  "Don't decide, compute: always add something, either the byte or 0. cmovb ecx, edx (with edx = 0) replaces the byte by 0 when it's below 128. cmov has no immediate form, so keep the 0 in a register.",
  "Other branchless tricks: setae dl / neg edx makes a mask of all ones or all zeros, then and ecx, edx. Either way the only branch left is the loop's, which is predictable.",
]

