<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="640" height="260" role="img">
<title>Little-endian: the least significant byte goes to the lowest address</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker></defs>
<rect x="0" y="0" width="640" height="260" fill="#ffffff"/>
<text x="320" y="26" font-family="monospace" font-size="15" xml:space="preserve" text-anchor="middle" font-weight="bold" fill="#222222">mov dword [x], 0x11223344</text>
<text x="148" y="72" font-family="sans-serif" font-size="14" xml:space="preserve" text-anchor="end" font-weight="bold" fill="#222222">value</text>
<rect x="160" y="48" width="80" height="40" rx="0" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="200.0" y="74" font-family="monospace" font-size="16" xml:space="preserve" text-anchor="middle" font-weight="bold" fill="#222222">11</text>
<rect x="240" y="48" width="80" height="40" rx="0" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="280.0" y="74" font-family="monospace" font-size="16" xml:space="preserve" text-anchor="middle" font-weight="bold" fill="#222222">22</text>
<rect x="320" y="48" width="80" height="40" rx="0" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="360.0" y="74" font-family="monospace" font-size="16" xml:space="preserve" text-anchor="middle" font-weight="bold" fill="#222222">33</text>
<rect x="400" y="48" width="80" height="40" rx="0" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5"/>
<text x="440.0" y="74" font-family="monospace" font-size="16" xml:space="preserve" text-anchor="middle" font-weight="bold" fill="#222222">44</text>
<text x="160" y="106" font-family="sans-serif" font-size="12" xml:space="preserve" text-anchor="start" font-weight="normal" fill="#6b7280">most significant</text>
<text x="480" y="106" font-family="sans-serif" font-size="12" xml:space="preserve" text-anchor="end" font-weight="normal" fill="#6b7280">least significant</text>
<text x="148" y="194" font-family="sans-serif" font-size="14" xml:space="preserve" text-anchor="end" font-weight="bold" fill="#222222">memory</text>
<rect x="160" y="170" width="80" height="40" rx="0" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5"/>
<text x="200.0" y="196" font-family="monospace" font-size="16" xml:space="preserve" text-anchor="middle" font-weight="bold" fill="#222222">44</text>
<text x="200.0" y="230" font-family="monospace" font-size="14" xml:space="preserve" text-anchor="middle" font-weight="normal" fill="#6b7280">x+0</text>
<rect x="240" y="170" width="80" height="40" rx="0" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="280.0" y="196" font-family="monospace" font-size="16" xml:space="preserve" text-anchor="middle" font-weight="bold" fill="#222222">33</text>
<text x="280.0" y="230" font-family="monospace" font-size="14" xml:space="preserve" text-anchor="middle" font-weight="normal" fill="#6b7280">x+1</text>
<rect x="320" y="170" width="80" height="40" rx="0" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="360.0" y="196" font-family="monospace" font-size="16" xml:space="preserve" text-anchor="middle" font-weight="bold" fill="#222222">22</text>
<text x="360.0" y="230" font-family="monospace" font-size="14" xml:space="preserve" text-anchor="middle" font-weight="normal" fill="#6b7280">x+2</text>
<rect x="400" y="170" width="80" height="40" rx="0" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="440.0" y="196" font-family="monospace" font-size="16" xml:space="preserve" text-anchor="middle" font-weight="bold" fill="#222222">11</text>
<text x="440.0" y="230" font-family="monospace" font-size="14" xml:space="preserve" text-anchor="middle" font-weight="normal" fill="#6b7280">x+3</text>
<line x1="200.0" y1="112" x2="440.0" y2="166" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="280.0" y1="112" x2="360.0" y2="166" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="360.0" y1="112" x2="280.0" y2="166" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="440.0" y1="112" x2="200.0" y2="166" stroke="#c2410c" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="320" y="254" font-family="sans-serif" font-size="12" xml:space="preserve" text-anchor="middle" font-weight="normal" fill="#6b7280">lowest address → highest address</text>
</svg>
