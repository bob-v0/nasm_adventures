hints = [
  """Define the layout once, with `struc`:

```
struc Person
    .next:  resq 1
    .age:   resd 1
    .flags: resb 1
            resb 3      ; padding
    .name:  resb 16
endstruc
```

NASM then knows `Person.age` = 8, `Person_size` = 32, and so on.""",
  """In `.data` (after your code), fill in a record with `istruc`:

```
newbie: istruc Person
    at Person.age,   dd 99
    at Person.flags, db 1
    at Person.name,  db "zed", 0
iend
```

Then link it in front: newbie.next = [head], then [head] = newbie.""",
  "Walk: rsi = [head]; while rsi != 0: use [rsi + Person.age] (a dword: mov r9d, ...), test byte [rsi + Person.flags], 1, ...; rsi = [rsi + Person.next].",
]

