<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300" role="img">
<title>The 32-byte Person record, and records linked into a list</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker></defs>
<rect x="0" y="0" width="700" height="300" fill="#ffffff"/>
<text x="30" y="22" font-family="monospace" font-size="14" xml:space="preserve" text-anchor="start" font-weight="bold" fill="#222222">struc Person   (Person_size = 32)</text>
<rect x="30" y="50" width="160" height="40" rx="0" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="110.0" y="75" font-family="monospace" font-size="13" xml:space="preserve" text-anchor="middle" font-weight="bold" fill="#1d4ed8">next</text>
<text x="30" y="108" font-family="monospace" font-size="12" xml:space="preserve" text-anchor="middle" font-weight="normal" fill="#6b7280">0</text>
<rect x="190" y="50" width="80" height="40" rx="0" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
<text x="230.0" y="75" font-family="monospace" font-size="13" xml:space="preserve" text-anchor="middle" font-weight="bold" fill="#15803d">age</text>
<text x="190" y="108" font-family="monospace" font-size="12" xml:space="preserve" text-anchor="middle" font-weight="normal" fill="#6b7280">8</text>
<rect x="270" y="50" width="20" height="40" rx="0" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5"/>
<text x="280.0" y="75" font-family="monospace" font-size="12" xml:space="preserve" text-anchor="middle" font-weight="bold" fill="#c2410c"></text>
<text x="270" y="108" font-family="monospace" font-size="12" xml:space="preserve" text-anchor="middle" font-weight="normal" fill="#6b7280">12</text>
<rect x="290" y="50" width="60" height="40" rx="0" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="320.0" y="75" font-family="monospace" font-size="13" xml:space="preserve" text-anchor="middle" font-weight="bold" fill="#6b7280"></text>
<text x="290" y="108" font-family="monospace" font-size="12" xml:space="preserve" text-anchor="middle" font-weight="normal" fill="#6b7280">13</text>
<rect x="350" y="50" width="320" height="40" rx="0" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
<text x="510.0" y="75" font-family="monospace" font-size="13" xml:space="preserve" text-anchor="middle" font-weight="bold" fill="#6d28d9">name</text>
<text x="350" y="108" font-family="monospace" font-size="12" xml:space="preserve" text-anchor="middle" font-weight="normal" fill="#6b7280">16</text>
<text x="670" y="108" font-family="monospace" font-size="12" xml:space="preserve" text-anchor="middle" font-weight="normal" fill="#6b7280">32</text>
<text x="286" y="44" font-family="monospace" font-size="12" xml:space="preserve" text-anchor="end" font-weight="bold" fill="#c2410c">flags</text>
<text x="296" y="44" font-family="sans-serif" font-size="12" xml:space="preserve" text-anchor="start" font-weight="normal" fill="#6b7280">padding</text>
<text x="30" y="158" font-family="sans-serif" font-size="14" xml:space="preserve" text-anchor="start" font-weight="bold" fill="#222222">a linked list: each next holds the address of the following record</text>
<rect x="30" y="190" width="70" height="36" rx="0" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="65" y="213" font-family="monospace" font-size="14" xml:space="preserve" text-anchor="middle" font-weight="bold" fill="#222222">head</text>
<line x1="100" y1="208" x2="148" y2="208" stroke="#222222" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="150" y="190" width="50" height="36" rx="0" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="175" y="213" font-family="monospace" font-size="12" xml:space="preserve" text-anchor="middle" font-weight="normal" fill="#1d4ed8">next</text>
<rect x="200" y="190" width="90" height="36" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="245" y="213" font-family="monospace" font-size="12" xml:space="preserve" text-anchor="middle" font-weight="normal" fill="#222222">age 30</text>
<path d="M 175 226 L 175 250 L 310 250 L 310 208 L 328 208" fill="none" stroke="#222222" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="330" y="190" width="50" height="36" rx="0" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="355" y="213" font-family="monospace" font-size="12" xml:space="preserve" text-anchor="middle" font-weight="normal" fill="#1d4ed8">next</text>
<rect x="380" y="190" width="90" height="36" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="425" y="213" font-family="monospace" font-size="12" xml:space="preserve" text-anchor="middle" font-weight="normal" fill="#222222">age 101</text>
<path d="M 355 226 L 355 250 L 490 250 L 490 208 L 508 208" fill="none" stroke="#222222" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="510" y="190" width="50" height="36" rx="0" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="535" y="213" font-family="monospace" font-size="12" xml:space="preserve" text-anchor="middle" font-weight="normal" fill="#1d4ed8">next</text>
<rect x="560" y="190" width="90" height="36" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="605" y="213" font-family="monospace" font-size="12" xml:space="preserve" text-anchor="middle" font-weight="normal" fill="#222222">age 7</text>
<line x1="535" y1="226" x2="535" y2="260" stroke="#222222" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="535" y="276" font-family="monospace" font-size="12" xml:space="preserve" text-anchor="middle" font-weight="normal" fill="#6b7280">0 = end of list</text>
</svg>
