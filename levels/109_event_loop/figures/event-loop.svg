<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" width="700" height="330" font-family="sans-serif" font-size="14">
  <defs>
    <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="700" height="330" fill="#fff"/>
  <!-- descriptors -->
  <text x="20" y="26" font-weight="bold">descriptors</text>
  <rect x="20" y="40" width="170" height="40" rx="6" fill="#fdebd3" stroke="#b35900" stroke-width="2"/>
  <text x="105" y="58" text-anchor="middle" font-size="13">listening socket, fd 3</text>
  <text x="105" y="74" text-anchor="middle" font-size="12" fill="#b35900">a client is connecting</text>
  <rect x="20" y="100" width="170" height="40" rx="6" fill="#f4f4f4" stroke="#999"/>
  <text x="105" y="118" text-anchor="middle" font-size="13">client, fd 5</text>
  <text x="105" y="134" text-anchor="middle" font-size="12" fill="#777">quiet</text>
  <rect x="20" y="160" width="170" height="40" rx="6" fill="#fdebd3" stroke="#b35900" stroke-width="2"/>
  <text x="105" y="178" text-anchor="middle" font-size="13">client, fd 6</text>
  <text x="105" y="194" text-anchor="middle" font-size="12" fill="#b35900">sent "hi\n"</text>
  <rect x="20" y="220" width="170" height="40" rx="6" fill="#f4f4f4" stroke="#999"/>
  <text x="105" y="238" text-anchor="middle" font-size="13">client, fd 7</text>
  <text x="105" y="254" text-anchor="middle" font-size="12" fill="#777">quiet</text>
  <!-- epoll -->
  <rect x="250" y="100" width="150" height="100" rx="10" fill="#e3effa" stroke="#1f6fb2" stroke-width="2"/>
  <text x="325" y="132" text-anchor="middle" font-weight="bold">epoll</text>
  <text x="325" y="154" text-anchor="middle" font-size="13">watches 3, 5, 6, 7</text>
  <text x="325" y="172" text-anchor="middle" font-size="13">for EPOLLIN</text>
  <g stroke="#999" stroke-width="1.5">
    <line x1="190" y1="60" x2="250" y2="120"/>
    <line x1="190" y1="120" x2="250" y2="140"/>
    <line x1="190" y1="180" x2="250" y2="160"/>
    <line x1="190" y1="240" x2="250" y2="180"/>
  </g>
  <!-- loop -->
  <text x="460" y="26" font-weight="bold">your event loop</text>
  <rect x="460" y="40" width="225" height="230" rx="10" fill="#fafafa" stroke="#555"/>
  <g font-size="13">
    <text x="474" y="66" font-family="monospace">epoll_wait(...) → 2</text>
    <text x="474" y="84" fill="#555">sleeps until something is ready</text>
    <text x="474" y="116" font-family="monospace">events[0]: data = 6</text>
    <text x="474" y="134" fill="#555">a client: read, echo back</text>
    <text x="474" y="166" font-family="monospace">events[1]: data = 3</text>
    <text x="474" y="184" fill="#555">the listener: accept4, then</text>
    <text x="474" y="202" fill="#555">epoll_ctl ADD the new fd</text>
    <text x="474" y="236" fill="#555">then back to epoll_wait</text>
  </g>
  <path d="M402,166 L456,166" stroke="#333" stroke-width="2" marker-end="url(#k)"/>
  <text x="406" y="140" font-size="12" fill="#333">ready:</text>
  <text x="406" y="155" font-size="12" fill="#333">6 and 3</text>
  <path d="M572,270 C572,310 440,310 360,204" fill="none" stroke="#333" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#k)"/>
  <text x="430" y="318" font-size="12" fill="#333">forever</text>
</svg>
