hints = [
  "One function per grammar rule: expr calls term, term calls factor, factor calls expr for parentheses. Keep the read cursor in one callee-saved register (e.g. rbx) that every function shares and advances.",
  "Precedence falls out of the structure: term handles * and / by calling factor, so 1 + 2 * 3 groups as 1 + (2 * 3). Loops (not recursion) handle repeated + and -, so they associate left: 8 - 2 - 1 = 5.",
  "Errors from deep inside the recursion: save rsp in a variable at the start, and on error restore it and jump to the error printer (C's setjmp/longjmp do this). Division: check for 0 and for -2^63 / -1 before idiv. Number literals: imul/add set OF on signed overflow.",
]

