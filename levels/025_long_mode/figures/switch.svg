<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 170" width="760" height="170" role="img">
<title>Entering long mode: PAE, CR3, EFER.LME, paging, then a far jump to a 64-bit segment</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker></defs>
<rect x="0" y="0" width="760" height="170" fill="#ffffff"/>
<rect x="20" y="40" width="120" height="56" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="80.0" y="64" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">CR4.PAE</text>
<text x="80.0" y="83" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#555555">8-byte entries</text>
<path d="M143,68.0 L165,68.0" stroke="#555555" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="168" y="40" width="120" height="56" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="228.0" y="64" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">CR3</text>
<text x="228.0" y="83" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#555555">= the PML4</text>
<path d="M291,68.0 L313,68.0" stroke="#555555" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="316" y="40" width="120" height="56" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="376.0" y="64" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">EFER.LME</text>
<text x="376.0" y="83" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#555555">(+ NXE)</text>
<path d="M439,68.0 L461,68.0" stroke="#555555" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="464" y="40" width="120" height="56" rx="6" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5"/>
<text x="524.0" y="64" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">CR0.PG</text>
<text x="524.0" y="83" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#555555">long mode active</text>
<path d="M587,68.0 L609,68.0" stroke="#555555" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="612" y="40" width="120" height="56" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
<text x="672.0" y="64" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">jmp 0x08:</text>
<text x="672.0" y="83" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#555555">64-bit code</text>
<text x="20" y="25" font-family="sans-serif" font-size="12" fill="#222222">32-bit protected mode</text>
<text x="464" y="25" font-family="sans-serif" font-size="12" fill="#c2410c">compatibility mode</text>
<text x="612" y="25" font-family="sans-serif" font-size="12" fill="#15803d">64-bit mode</text>
<text x="20" y="128" font-family="sans-serif" font-size="12" fill="#555555">Paging on without LME: 32-bit PAE paging reads the PML4 as the wrong kind of table, and the next fetch page-faults.</text>
<text x="20" y="146" font-family="sans-serif" font-size="12" fill="#555555">After the far jump: reload ds, es, ss; then mov rax, HIGH + label and jmp rax to run in the higher half.</text>
</svg>
