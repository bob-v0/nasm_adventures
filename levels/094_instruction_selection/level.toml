hints = [
  "div by 10 takes about 26 cycles, and the divider can't start another for 24: that alone is most of the loop's time. A division by a constant is really a multiplication and a shift. Each of the other lessons in the brief (partial registers, loop) also points at a line of the starter.",
  "For 0 <= b < 1024, b / 10 == (b * 205) >> 11. Then b % 10 = b - 10 * (b / 10), and 10q = (q + 4q) * 2: an lea and an add. Load the byte with movzx: mov al, [rdi] writes only the low byte of rax, so it depends on whatever rax held before (a false dependency chaining the iterations together).",
  """Per byte, a multiply and a shift instead of `div`:

```
movzx eax, byte [rdi]       ; b: a full write, no false dependency on the old rax
imul ecx, eax, 205
shr ecx, 11                 ; q = b / 10
lea ecx, [rcx + rcx*4]      ; 5q
add ecx, ecx                ; 10q
sub eax, ecx                ; b % 10
add ebx, eax                ; into the total
```

Then replace `loop` (7 uops) with `dec rsi` / `jnz` (1 fused uop), and drop the `push rcx` / `pop rcx`: they were only there because `div` needs ecx.""",
]

