hints = [
  "vpcmpgtd k1, zmm0, zmm1 compares 16 dword pairs and puts the 16 answers as bits in the mask register k1. vpcompressd [rcx]{k1}, zmm0 then stores only the lanes whose bit is set, one after the other, from rcx on. kmovw r9d, k1 / popcnt r9d, r9d is how many it stored: advance rcx by that many dwords.",
  "The broadcast of the threshold: vpbroadcastd zmm1, edx (AVX-512 can broadcast straight from a general register).",
  "The last n % 16 elements: a mask with the low n % 16 bits set (mov eax, −1 / bzhi eax, eax, esi), kmovw k2, eax, then vmovdqu32 zmm0{k2}{z}, [rdi]: masked-off lanes aren't read at all, so nothing past the end is touched (the page after it isn't mapped). Compare with the same mask, vpcmpgtd k1{k2}, ..., so the zeroed lanes never count.",
]

