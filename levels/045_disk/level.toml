hints = [
  """`int 13h` with `ah = 0x42` reads sectors by number (LBA): dl = the drive, ds:si = a 16-byte disk address packet:

```
dap:
    db 16, 0            ; the packet's size, then a reserved 0
    dw 1                ; how many sectors to read
    dw 0x8000, 0        ; where to put them: offset, then segment
    dq 1                ; the first sector's number (LBA)
```

The boot sector is LBA 0; stage 2 starts at LBA 1. `int 13h` returns with the carry flag set on errors.""",
  "You don't know stage 2's size before you've read its header: read 1 sector first, check the magic word at 0x8000, take the count from 0x8002, then read that many from LBA 1 again (overwriting the first one, harmlessly).",
  "Keep dl (save it as soon as you start: other code may need dx), set your segments (level 48: the game also boots this with another BIOS), and enter stage 2 with a far jump to 0:0x8004.",
]

