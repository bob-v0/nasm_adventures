<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 220" width="740" height="220" role="img">
<title>The BSP sends INIT and two STARTUP IPIs; each AP runs the trampoline into the kernel</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker></defs>
<rect x="0" y="0" width="740" height="220" fill="#ffffff"/>
<text x="20" y="40" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">BSP</text>
<text x="20" y="150" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">AP</text>
<line x1="70" y1="36" x2="720" y2="36" stroke="#888888"/>
<line x1="70" y1="146" x2="720" y2="146" stroke="#888888"/>
<path d="M110,38 L110,140" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="116" y="70" font-family="monospace" font-size="12" fill="#1d4ed8">INIT</text>
<path d="M300,38 L300,140" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="306" y="70" font-family="monospace" font-size="12" fill="#1d4ed8">STARTUP 8</text>
<path d="M400,38 L400,140" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="406" y="70" font-family="monospace" font-size="12" fill="#1d4ed8">STARTUP 8</text>
<text x="160" y="26" font-family="sans-serif" font-size="11" fill="#555555">wait 10 ms</text>
<text x="336" y="26" font-family="sans-serif" font-size="11" fill="#555555">200 µs</text>
<rect x="300" y="156" width="130" height="30" rx="4" fill="#ffedd5" stroke="#c2410c" stroke-width="1.4"/>
<text x="365.0" y="176" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#222222">0x8000: real mode</text>
<rect x="440" y="156" width="120" height="30" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="500.0" y="176" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#222222">protected mode</text>
<rect x="570" y="156" width="140" height="30" rx="4" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/>
<text x="640.0" y="176" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#222222">ap_entry: hello</text>
<text x="20" y="212" font-family="sans-serif" font-size="12" fill="#555555">The trampoline: lgdt, CR0.PE, a far jump into the kernel. (Shorthand "all but me" wakes every AP at once.)</text>
</svg>
