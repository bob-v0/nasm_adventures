<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 216" width="720" font-family="sans-serif" font-size="14">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs>
<rect width="720" height="216" fill="#ffffff"/>
<text x="360" y="22" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">How a PC dies: each failure to deliver becomes a new exception</text>
<rect x="15.0" y="50" width="150" height="50" fill="#ffffff" stroke="#222"/>
<text x="90.0" y="81" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">an exception</text>
<text x="90.0" y="122" font-size="12" text-anchor="middle" fill="#222">e.g. #UD (6) in the module</text>
<line x1="167.0" y1="75" x2="193.0" y2="75" stroke="#444" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="195.0" y="50" width="150" height="50" fill="#fff2cc" stroke="#222"/>
<text x="270.0" y="81" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">#GP (13)</text>
<text x="270.0" y="122" font-size="12" text-anchor="middle" fill="#222">usually: its gate is missing, past</text>
<text x="270.0" y="137" font-size="12" text-anchor="middle" fill="#222">the IDT limit, not present, or bad</text>
<line x1="347.0" y1="75" x2="373.0" y2="75" stroke="#444" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="375.0" y="50" width="150" height="50" fill="#fce5cd" stroke="#222"/>
<text x="450.0" y="81" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">#DF (8)</text>
<text x="450.0" y="122" font-size="12" text-anchor="middle" fill="#222">delivering #GP</text>
<text x="450.0" y="137" font-size="12" text-anchor="middle" fill="#222">failed too</text>
<line x1="527.0" y1="75" x2="553.0" y2="75" stroke="#444" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="555.0" y="50" width="150" height="50" fill="#f4c7c3" stroke="#222"/>
<text x="630.0" y="81" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">shutdown</text>
<text x="630.0" y="122" font-size="12" text-anchor="middle" fill="#222">delivering #DF failed:</text>
<text x="630.0" y="137" font-size="12" text-anchor="middle" fill="#222">the chipset resets the PC</text>
<text x="360" y="180" font-size="13" text-anchor="middle" fill="#222">The whole chain is the "triple fault": no message, just an instant reboot.</text>
<text x="360" y="200" font-size="13" text-anchor="middle" fill="#222">The first exception is the real event; the rest is the CPU failing to report it.</text>
</svg>
