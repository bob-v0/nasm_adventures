level = 148
slug = "sorting"
title = "Sorting"
arc = "III"
mode = "fragment"
concepts = ["insertion sort", "nested loops with a shifting inner loop", "signed comparison of array elements", "stable sorting"]
introduces = []

hints = [
  "Insertion sort: for i = 1 .. n-1, take x = arr[i] and slide larger elements one slot to the right until you find where x belongs, then store x there. The part before i is always sorted.",
  "Inner loop: j = i; while j > 0 and arr[j-1] > x (SIGNED: jg/jle): arr[j] = arr[j-1]; j--. Then arr[j] = x. Guard n = 0 and n = 1.",
  """i in r8, x in rax, j in r9:

```
    mov r8d, 1                  ; i = 1
.outer:
    cmp r8, rsi
    jae .done                   ; also covers n = 0 and n = 1
    mov rax, [arr + r8*8]       ; x = arr[i]
    mov r9, r8                  ; j = i
.inner:
    test r9, r9
    jz .place                   ; j = 0: x goes first
    mov rdx, [arr + r9*8 - 8]   ; arr[j-1]
    cmp rdx, rax
    jle .place                  ; signed: arr[j-1] <= x, so x goes at j
    mov [arr + r9*8], rdx       ; slide arr[j-1] one slot right
    dec r9
    jmp .inner
.place:
    mov [arr + r9*8], rax       ; arr[j] = x
    inc r8
    jmp .outer
.done:
```""",
]

[constraints]
max_instructions = 30
preserve = ["rsp", "rsi"]
max_steps = 400000

