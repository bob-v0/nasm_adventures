level = 142
slug = "stack"
title = "The Stack"
arc = "IV"
mode = "fragment"
concepts = ["the hardware stack: rsp, push, pop", "last in, first out", "the stack grows down", "leaving rsp as you found it"]
introduces = ["push", "pop", "rsp"]

hints = [
  "Reversing: push every character, then pop them back into `out`; they come out in reverse order. A push moves a whole qword, so load each byte into a full register first (`movzx eax, byte [...]`, then `push rax`). Count how many you pushed, so you pop exactly that many.",
  "Brackets: push each opening bracket. On a closing one, the stack must not be empty, and the bracket you pop must be its partner. You can't tell \"empty\" by looking at rsp's data (there's other data below), so keep your own counter. At the end the counter must be 0.",
  "If you stop early on a mismatch, you still have to drop what you pushed, so rsp ends where it started: `add rsp, 8 * count` for a constant count, or `lea rsp, [rsp + rcx*8]` to drop rcx qwords.",
]

[constraints]
max_instructions = 64
must_use = ["push", "pop"]
poison = true
max_steps = 3000

[random]
count = 50
