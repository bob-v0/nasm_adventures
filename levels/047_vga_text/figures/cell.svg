<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 248" width="720" font-family="sans-serif" font-size="14">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs>
<rect width="720" height="248" fill="#ffffff"/>
<text x="360" y="22" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">One screen cell = two bytes at B8000 + row × 160 + column × 2</text>
<rect x="60" y="46" width="160" height="40" fill="#d9ead3" stroke="#222"/>
<text x="140" y="71" font-size="14" text-anchor="middle" fill="#222" font-family="monospace">0x41  'A'</text>
<text x="140" y="104" font-size="12" text-anchor="middle" fill="#555">byte 0: the character</text>
<text x="140" y="120" font-size="12" text-anchor="middle" fill="#555">(code page 437)</text>
<rect x="220" y="46" width="160" height="40" fill="#fff2cc" stroke="#222"/>
<text x="300" y="71" font-size="14" text-anchor="middle" fill="#222" font-family="monospace">0x1E</text>
<text x="300" y="104" font-size="12" text-anchor="middle" fill="#555">byte 1: the attribute</text>
<rect x="420" y="46" width="34" height="40" fill="#eeeeee" stroke="#222"/>
<text x="437.0" y="71" font-size="15" text-anchor="middle" fill="#222" font-family="monospace">0</text>
<text x="437.0" y="40" font-size="12" text-anchor="middle" fill="#555" font-family="monospace">7</text>
<rect x="454" y="46" width="34" height="40" fill="#c9daf8" stroke="#222"/>
<text x="471.0" y="71" font-size="15" text-anchor="middle" fill="#222" font-family="monospace">0</text>
<text x="471.0" y="40" font-size="12" text-anchor="middle" fill="#555" font-family="monospace">6</text>
<rect x="488" y="46" width="34" height="40" fill="#c9daf8" stroke="#222"/>
<text x="505.0" y="71" font-size="15" text-anchor="middle" fill="#222" font-family="monospace">0</text>
<text x="505.0" y="40" font-size="12" text-anchor="middle" fill="#555" font-family="monospace">5</text>
<rect x="522" y="46" width="34" height="40" fill="#c9daf8" stroke="#222"/>
<text x="539.0" y="71" font-size="15" text-anchor="middle" fill="#222" font-family="monospace">1</text>
<text x="539.0" y="40" font-size="12" text-anchor="middle" fill="#555" font-family="monospace">4</text>
<rect x="556" y="46" width="34" height="40" fill="#fce5cd" stroke="#222"/>
<text x="573.0" y="71" font-size="15" text-anchor="middle" fill="#222" font-family="monospace">1</text>
<text x="573.0" y="40" font-size="12" text-anchor="middle" fill="#555" font-family="monospace">3</text>
<rect x="590" y="46" width="34" height="40" fill="#fce5cd" stroke="#222"/>
<text x="607.0" y="71" font-size="15" text-anchor="middle" fill="#222" font-family="monospace">1</text>
<text x="607.0" y="40" font-size="12" text-anchor="middle" fill="#555" font-family="monospace">2</text>
<rect x="624" y="46" width="34" height="40" fill="#fce5cd" stroke="#222"/>
<text x="641.0" y="71" font-size="15" text-anchor="middle" fill="#222" font-family="monospace">1</text>
<text x="641.0" y="40" font-size="12" text-anchor="middle" fill="#555" font-family="monospace">1</text>
<rect x="658" y="46" width="34" height="40" fill="#fce5cd" stroke="#222"/>
<text x="675.0" y="71" font-size="15" text-anchor="middle" fill="#222" font-family="monospace">0</text>
<text x="675.0" y="40" font-size="12" text-anchor="middle" fill="#555" font-family="monospace">0</text>
<line x1="380" y1="66" x2="420" y2="66" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="437.0" y="104" font-size="12" text-anchor="middle" fill="#222">blink</text>
<text x="505.0" y="104" font-size="12" text-anchor="middle" fill="#222">background</text>
<text x="505.0" y="120" font-size="12" text-anchor="middle" fill="#222" font-family="monospace">001 = blue</text>
<text x="624" y="104" font-size="12" text-anchor="middle" fill="#222">foreground</text>
<text x="624" y="120" font-size="12" text-anchor="middle" fill="#222" font-family="monospace">1110 = yellow</text>
<text x="360" y="160" font-size="13" text-anchor="middle" fill="#222">The cell shows a yellow A on blue:</text>
<rect x="320" y="172" width="80" height="60" fill="#0000aa" stroke="#222"/>
<text x="360" y="214" font-size="40" text-anchor="middle" fill="#ffff55" font-weight="bold" font-family="monospace">A</text>
</svg>
