  "Pick a sphere far away: b huge, a and c small (a = 1, b = 1e9, c = 1). The roots are about −1e−9 and −1e9. Now follow −b + √(b² − 4ac): b² − 4ac rounds to b², so √ gives back |b| and the sum is 0: the near root comes out as 0 (or garbage) instead of −1e−9. Your witness: ;! witness a = \"1\", b = \"1e9\", c = \"1\"",
  "Never subtract the two nearly equal numbers: compute q = −(b + sign(b)·√d) / 2 (an addition of two numbers with the same sign: no cancellation). Then the roots are q / a and c / q (because the product of the roots is c / a). sign(b): test the sign bit, or use b ≥ 0. When b = 0 either sign works.",
