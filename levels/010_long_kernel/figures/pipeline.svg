<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" width="760" height="290" role="img">
<title>echo hi | wc: two processes, one pipe, file descriptors pointing at shared open files</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker></defs>
<rect x="0" y="0" width="760" height="290" fill="#ffffff"/>
<text x="20" y="26" font-family="monospace" font-size="14" font-weight="bold" fill="#222222">echo hi | wc</text>
<rect x="20" y="44" width="170" height="150" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="105" y="66" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#222222">echo (pid 2)</text>
<rect x="34" y="82" width="142" height="26" fill="#ffffff" stroke="#888888"/>
<text x="44" y="100" font-family="monospace" font-size="12" fill="#222222">fd 0: console</text>
<rect x="34" y="116" width="142" height="26" fill="#ffffff" stroke="#888888"/>
<text x="44" y="134" font-family="monospace" font-size="12" fill="#222222">fd 1: pipe →</text>
<rect x="34" y="150" width="142" height="26" fill="#ffffff" stroke="#888888"/>
<text x="44" y="168" font-family="monospace" font-size="12" fill="#222222">fd 2: console</text>
<rect x="570" y="44" width="170" height="150" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="655" y="66" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#222222">wc (pid 3)</text>
<rect x="584" y="82" width="142" height="26" fill="#ffffff" stroke="#888888"/>
<text x="594" y="100" font-family="monospace" font-size="12" fill="#222222">fd 0: ← pipe</text>
<rect x="584" y="116" width="142" height="26" fill="#ffffff" stroke="#888888"/>
<text x="594" y="134" font-family="monospace" font-size="12" fill="#222222">fd 1: console</text>
<rect x="584" y="150" width="142" height="26" fill="#ffffff" stroke="#888888"/>
<text x="594" y="168" font-family="monospace" font-size="12" fill="#222222">fd 2: console</text>
<rect x="300" y="100" width="160" height="70" rx="6" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5"/>
<text x="380" y="124" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#222222">the pipe</text>
<text x="380" y="142" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#555555">4 KiB buffer</text>
<text x="380" y="158" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#555555">1 writer · 1 reader</text>
<path d="M176,129 L296,129" stroke="#555555" stroke-width="1.5" marker-end="url(#arr)"/>
<path d="M462,129 L582,103" stroke="#555555" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="20" y="228" font-family="sans-serif" font-size="12" fill="#555555">The shell: pipe, then fork twice. In each child, dup2 the pipe's end onto fd 1 (or 0), close the extra fds,</text>
<text x="20" y="246" font-family="sans-serif" font-size="12" fill="#555555">execve. The shell closes both ends too, and waits for both. echo exits: its end's last reference goes,</text>
<text x="20" y="264" font-family="sans-serif" font-size="12" fill="#555555">no writers are left, and wc's next read returns 0: the end of its input.</text>
</svg>
