<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" width="720" height="220" role="img">
<title>After the remap the page table says frame B, but the TLB still says frame A</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker></defs>
<rect x="0" y="0" width="720" height="220" fill="#ffffff"/>
<rect x="30" y="80" width="150" height="54" rx="5" fill="#eeeeee" stroke="#888888" stroke-width="1.5"/>
<text x="105.0" y="102" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#222222">mov rax, [WINDOW]</text>
<text x="105.0" y="120" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#555555">the program's access</text>
<rect x="260" y="20" width="180" height="54" rx="5" fill="#f6d0cc" stroke="#b8322a" stroke-width="1.5"/>
<text x="350.0" y="42" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#222222">TLB</text>
<text x="350.0" y="60" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#555555">WINDOW → frame A (cached)</text>
<rect x="260" y="140" width="180" height="54" rx="5" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
<text x="350.0" y="162" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#222222">page table</text>
<text x="350.0" y="180" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#555555">WINDOW → frame B (new)</text>
<rect x="530" y="20" width="150" height="54" rx="5" fill="#f6d0cc" stroke="#b8322a" stroke-width="1.5"/>
<text x="605.0" y="42" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#222222">frame A</text>
<text x="605.0" y="60" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#555555">record 0</text>
<rect x="530" y="140" width="150" height="54" rx="5" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
<text x="605.0" y="162" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#222222">frame B</text>
<text x="605.0" y="180" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#555555">record 1</text>
<path d="M180,90 L257,52" stroke="#555555" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="196" y="96" font-family="sans-serif" font-size="11" fill="#555555">looked up first</text>
<path d="M440,47 L527,47" stroke="#b8322a" stroke-width="1.5" marker-end="url(#arr)"/>
<path d="M440,167 L527,167" stroke="#15803d" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arr)"/>
<text x="350" y="110" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#555555">invlpg [WINDOW] drops the cached line</text>
</svg>
