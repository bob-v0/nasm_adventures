concepts = ["a bug that vanishes when you look", "one instruction isn't one step: inc [mem] is read, add, write", "the lock prefix: read-modify-write as one, for every CPU", "deterministic runs (one CPU at a time) versus truly parallel ones", "reference counting across CPUs"]
