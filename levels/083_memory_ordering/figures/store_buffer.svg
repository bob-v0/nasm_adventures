<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" font-family="sans-serif" font-size="13" fill="#222">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs>
<rect x="0" y="0" width="720" height="340" fill="#ffffff"/>
<rect x="30" y="20" width="300" height="74" rx="3" fill="#eeeeee" stroke="#555" stroke-width="1.2"/>
<text x="42" y="40" font-size="14" text-anchor="start" font-weight="bold" fill="#222">left core</text>
<text x="42" y="62" font-size="13" text-anchor="start" font-weight="normal" fill="#222" font-family="monospace">mov dword [x], 1</text>
<text x="42" y="82" font-size="13" text-anchor="start" font-weight="normal" fill="#222" font-family="monospace">mov eax, [y]</text>
<text x="210" y="62" font-size="13" text-anchor="start" font-weight="normal" fill="#666" font-family="monospace">; 1. store</text>
<text x="210" y="82" font-size="13" text-anchor="start" font-weight="normal" fill="#666" font-family="monospace">; 2. load</text>
<rect x="50" y="124" width="170" height="44" rx="3" fill="#f6d0cc" stroke="#b8322a" stroke-width="1.2"/>
<text x="135" y="141" font-size="12" text-anchor="middle" font-weight="normal" fill="#666">store buffer</text>
<text x="135" y="160" font-size="13" text-anchor="middle" font-weight="bold" fill="#222" font-family="monospace">x = 1  (waiting)</text>
<line x1="135" y1="94" x2="135" y2="122" stroke="#444" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="135" y1="168" x2="135" y2="232" stroke="#444" stroke-width="1.2" marker-end="url(#arrow)" stroke-dasharray="5 4"/>
<text x="143" y="205" font-size="12" text-anchor="start" font-weight="normal" fill="#666">drains later</text>
<line x1="280" y1="232" x2="280" y2="96" stroke="#2a5f9e" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="274" y="170" font-size="12" text-anchor="end" font-weight="normal" fill="#2a5f9e">load y</text>
<text x="288" y="170" font-size="13" text-anchor="start" font-weight="bold" fill="#2a5f9e">→ 0</text>
<rect x="390" y="20" width="300" height="74" rx="3" fill="#eeeeee" stroke="#555" stroke-width="1.2"/>
<text x="402" y="40" font-size="14" text-anchor="start" font-weight="bold" fill="#222">right core</text>
<text x="402" y="62" font-size="13" text-anchor="start" font-weight="normal" fill="#222" font-family="monospace">mov dword [y], 1</text>
<text x="402" y="82" font-size="13" text-anchor="start" font-weight="normal" fill="#222" font-family="monospace">mov eax, [x]</text>
<text x="570" y="62" font-size="13" text-anchor="start" font-weight="normal" fill="#666" font-family="monospace">; 1. store</text>
<text x="570" y="82" font-size="13" text-anchor="start" font-weight="normal" fill="#666" font-family="monospace">; 2. load</text>
<rect x="410" y="124" width="170" height="44" rx="3" fill="#f6d0cc" stroke="#b8322a" stroke-width="1.2"/>
<text x="495" y="141" font-size="12" text-anchor="middle" font-weight="normal" fill="#666">store buffer</text>
<text x="495" y="160" font-size="13" text-anchor="middle" font-weight="bold" fill="#222" font-family="monospace">y = 1  (waiting)</text>
<line x1="495" y1="94" x2="495" y2="122" stroke="#444" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="495" y1="168" x2="495" y2="232" stroke="#444" stroke-width="1.2" marker-end="url(#arrow)" stroke-dasharray="5 4"/>
<text x="503" y="205" font-size="12" text-anchor="start" font-weight="normal" fill="#666">drains later</text>
<line x1="640" y1="232" x2="640" y2="96" stroke="#2a5f9e" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="634" y="170" font-size="12" text-anchor="end" font-weight="normal" fill="#2a5f9e">load x</text>
<text x="648" y="170" font-size="13" text-anchor="start" font-weight="bold" fill="#2a5f9e">→ 0</text>
<rect x="30" y="234" width="660" height="50" rx="3" fill="#d3e4f5" stroke="#2a5f9e" stroke-width="1.2"/>
<text x="360" y="255" font-size="12" text-anchor="middle" font-weight="normal" fill="#666">memory (and the caches every core sees)</text>
<text x="300" y="274" font-size="14" text-anchor="middle" font-weight="bold" fill="#222" font-family="monospace">x = 0</text>
<text x="420" y="274" font-size="14" text-anchor="middle" font-weight="bold" fill="#222" font-family="monospace">y = 0</text>
<text x="30" y="312" font-size="12" text-anchor="start" font-weight="normal" fill="#666">Each core's store waits in its own store buffer. Its load goes straight to memory, where</text>
<text x="30" y="328" font-size="12" text-anchor="start" font-weight="normal" fill="#666">the other core's store hasn't arrived yet. Both loads read 0.</text>
</svg>
