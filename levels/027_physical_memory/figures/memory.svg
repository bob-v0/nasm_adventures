<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 215" width="760" height="215" role="img">
<title>Physical memory on a 16 MiB PC: only the free frames are handed out</title>
<rect x="0" y="0" width="760" height="215" fill="#ffffff"/>
<text x="30" y="30" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">Physical memory, 16 MiB (not to scale)</text>
<rect x="30" y="72" width="100" height="56" fill="#eeeeee" stroke="#888888" stroke-width="1.5"/>
<text x="80.0" y="97" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#222222">low memory</text>
<text x="80.0" y="114" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#555555">0 – 1 MiB</text>
<rect x="130" y="72" width="110" height="56" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="185.0" y="97" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#222222">kernel</text>
<text x="185.0" y="114" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#555555">+ .bss (bitmap)</text>
<rect x="240" y="72" width="130" height="56" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5"/>
<text x="305.0" y="97" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#222222">loader data</text>
<text x="305.0" y="114" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#555555">+ modules</text>
<rect x="370" y="72" width="270" height="56" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
<text x="505.0" y="97" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#222222">free frames</text>
<text x="505.0" y="114" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#555555">handed out by alloc_frame</text>
<rect x="640" y="72" width="90" height="56" fill="#eeeeee" stroke="#888888" stroke-width="1.5"/>
<text x="685.0" y="97" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#222222">reserved</text>
<text x="685.0" y="114" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#555555">top 128 KiB</text>
<line x1="30" y1="128" x2="30" y2="136" stroke="#555555"/>
<text x="30" y="150" font-family="monospace" font-size="11" text-anchor="start" fill="#222222">0</text>
<line x1="130" y1="128" x2="130" y2="136" stroke="#555555"/>
<text x="130" y="166" font-family="monospace" font-size="11" text-anchor="middle" fill="#222222">1 MiB</text>
<line x1="240" y1="128" x2="240" y2="136" stroke="#555555"/>
<text x="240" y="150" font-family="monospace" font-size="11" text-anchor="middle" fill="#222222">kernel_end</text>
<line x1="370" y1="128" x2="370" y2="136" stroke="#555555"/>
<text x="370" y="166" font-family="monospace" font-size="11" text-anchor="middle" fill="#222222">end of the last module</text>
<line x1="640" y1="128" x2="640" y2="136" stroke="#555555"/>
<text x="640" y="150" font-family="monospace" font-size="11" text-anchor="middle" fill="#222222">0xFE0000</text>
<line x1="730" y1="128" x2="730" y2="136" stroke="#555555"/>
<text x="730" y="166" font-family="monospace" font-size="11" text-anchor="end" fill="#222222">16 MiB</text>
<path d="M30,68 V62 H370 V68" fill="none" stroke="#b8322a" stroke-width="1.5"/>
<text x="30" y="55" font-family="sans-serif" font-size="12" fill="#b8322a">in use already (much of it is available RAM): never handed out</text>
<text x="30" y="201" font-family="sans-serif" font-size="12" fill="#555555">Grey: not available, or below 1 MiB. Bitmap bit n = frame n, at address n × 4096.</text>
</svg>
