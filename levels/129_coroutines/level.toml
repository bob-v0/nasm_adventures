hints = [
  "On entry to co_switch, [rsp] is the return address into the code that called it. Save rsp and the six callee-saved registers into *save, load all seven from *load, and `ret`: that pops the return address of the OTHER context.",
  "Why only callee-saved registers? co_switch is called like a function, so its caller already assumes the scratch registers are destroyed. The rest of the state is on each context's own stack.",
  "mov [rdi], rsp / mov [rdi+8], rbx / mov [rdi+16], rbp / mov [rdi+24], r12 ... r15, then mov rsp, [rsi] / mov rbx, [rsi+8] ... / ret. Seven stores, seven loads, one ret.",
]

