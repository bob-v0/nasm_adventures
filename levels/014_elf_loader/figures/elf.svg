<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 270" width="800" height="270" role="img">
<title>An ELF file: header, program headers and segments, mapped into memory with .bss added</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker></defs>
<rect x="0" y="0" width="800" height="270" fill="#ffffff"/>
<text x="100" y="22" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#222222">the file</text>
<text x="560" y="22" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#222222">memory, from p_vaddr</text>
<rect x="30" y="32" width="140" height="34" fill="#eeeeee" stroke="#888888" stroke-width="1.5"/>
<text x="100" y="54.0" font-family="monospace" font-size="12" text-anchor="middle" fill="#222222">ELF header</text>
<rect x="30" y="66" width="140" height="34" fill="#eeeeee" stroke="#888888" stroke-width="1.5"/>
<text x="100" y="88.0" font-family="monospace" font-size="12" text-anchor="middle" fill="#222222">program headers</text>
<rect x="30" y="100" width="140" height="50" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="100" y="130.0" font-family="monospace" font-size="12" text-anchor="middle" fill="#222222">.text</text>
<rect x="30" y="150" width="140" height="34" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
<text x="100" y="172.0" font-family="monospace" font-size="12" text-anchor="middle" fill="#222222">.data</text>
<rect x="490" y="52" width="140" height="50" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="560" y="82.0" font-family="monospace" font-size="12" text-anchor="middle" fill="#222222">.text</text>
<text x="640" y="81.0" font-family="sans-serif" font-size="11" fill="#555555">0x401000 (r-x)</text>
<path d="M172,125.0 L486,77.0" stroke="#555555" stroke-width="1.3" marker-end="url(#arr)"/>
<rect x="490" y="102" width="140" height="34" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
<text x="560" y="124.0" font-family="monospace" font-size="12" text-anchor="middle" fill="#222222">.data</text>
<text x="640" y="123.0" font-family="sans-serif" font-size="11" fill="#555555">0x402000 (rw-)</text>
<path d="M172,167.0 L486,119.0" stroke="#555555" stroke-width="1.3" marker-end="url(#arr)"/>
<rect x="490" y="136" width="140" height="60" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5" stroke-dasharray="5,4"/>
<text x="560" y="171.0" font-family="monospace" font-size="12" text-anchor="middle" fill="#222222">.bss</text>
<text x="640" y="170.0" font-family="sans-serif" font-size="11" fill="#555555">zeros: memsz − filesz</text>
<text x="30" y="240" font-family="sans-serif" font-size="12" fill="#555555">A PT_LOAD segment: copy p_filesz bytes from p_offset to p_vaddr; map p_memsz bytes in all.</text>
<text x="30" y="258" font-family="sans-serif" font-size="12" fill="#555555">The part past p_filesz is .bss: in memory only, all zeros.</text>
</svg>
