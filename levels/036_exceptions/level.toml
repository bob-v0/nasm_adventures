level = 36
slug = "exceptions"
title = "Exceptions"
arc = "XII"
mode = "multiboot"
concepts = ["exceptions: the CPU's own interrupts, vectors 0-31", "the IDT: gates instead of far pointers", "interrupt gates: selector, offset, type, DPL, present", "faults, traps and aborts: which eip is pushed", "error codes: which exceptions push one", "one stub per vector, one common handler"]
introduces = ["IDT", "lidt", "interrupt gates (0x8E)", "#DE #BP #OF #UD #GP", "error codes", "%rep / %assign stubs"]

hints = [
  """A gate is 8 bytes:

| Bytes | Holds |
|---|---|
| 0-1 | the handler's offset, bits 0-15 |
| 2-3 | the code selector, 0x08 |
| 4 | 0 |
| 5 | 0x8E: present, DPL 0, 32-bit interrupt gate |
| 6-7 | the handler's offset, bits 16-31 |

The offsets aren't known until link time, so you can't write the gates out with `dw` and `db`: fill the table in a loop from a list of handler addresses (`dd stub0, stub1, ...`). `lidt` takes the same 6-byte pointer as `lgdt`: the limit (32 × 8 − 1), then the base.""",
  "The CPU pushes eflags, cs, eip and, for vectors 8, 10-14, 17, 21, 29 and 30 only, an error code. Give each vector a tiny stub that pushes a dummy 0 where there's no error code and then its vector number, and jump to one common handler: then [esp] is the vector, [esp + 4] the error code and [esp + 8] the eip, always.",
  """NASM can write the 32 stubs for you. Put one stub in a `%macro`, with `%if` for the vectors that get an error code from the CPU, then repeat it:

```
%assign n 0
%rep 32
    ; (a stub using n)
%assign n n + 1
%endrep
```

Faults push the eip of the faulting instruction; traps (int3, into) push the eip after it.""",
]

[constraints]
max_instructions = 300

