level = 138
slug = "stack_frames"
title = "Stack Frames"
arc = "IV"
mode = "function"
entry = "ring_run"
concepts = ["frame pointers: the rbp chain", "[rbp] = caller's rbp, [rbp + 8] = return address", "enter / leave", "how debuggers and profilers produce backtraces"]
introduces = ["rbp frames", "leave", "enter", "backtraces"]

hints = [
  "At the start of backtrace, [rsp] is your own return address: that's entry 0. rbp still belongs to your caller (ring_nest), whose frame looks like [rbp] = saved rbp, [rbp + 8] = return address.",
  "Loop: store [rbp + 8], then rbp = [rbp], until the rbp you'd follow is 0 or the buffer is full. Use a copy of rbp in another register: you must not change rbp itself (it's callee-saved).",
  """Write entry 0 first, then walk a copy of rbp. Keep the count in rax: it's also the return value.

```
    xor eax, eax            ; nothing written yet
    test rsi, rsi
    jz .done                ; max = 0: not even entry 0
    mov rcx, [rsp]          ; your own return address
    mov [rdi], rcx
    mov eax, 1
    mov rdx, rbp            ; a copy: rbp itself is callee-saved
.walk:
    cmp rax, rsi
    jae .done               ; the buffer is full
    test rdx, rdx
    jz .done                ; the end of the chain
    mov rcx, [rdx + 8]      ; this frame's return address
    mov [rdi + rax*8], rcx
    inc rax
    mov rdx, [rdx]          ; on to the caller's frame
    jmp .walk
.done:
    ret
```""",
]

[constraints]
max_instructions = 30
max_steps = 2000

