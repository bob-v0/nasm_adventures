<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" font-family="sans-serif" font-size="14">
  <rect width="720" height="250" fill="#ffffff"/>
  <text x="360" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">One register, three names</text>
  <g font-family="monospace" font-size="12" fill="#555" text-anchor="middle">
    <text x="90" y="48">511</text>
    <text x="390" y="48">255</text>
    <text x="542" y="48">127</text>
    <text x="680" y="48">0</text>
  </g>
  <rect x="80" y="56" width="610" height="34" fill="#eeeeee" stroke="#222"/>
  <text x="70" y="78" text-anchor="end" fill="#222">zmm0</text>
  <text x="225" y="78" text-anchor="middle" fill="#555">bits 256–511 (AVX-512, level 59)</text>
  <rect x="385" y="100" width="305" height="34" fill="#c9daf8" stroke="#222"/>
  <text x="70" y="122" text-anchor="end" fill="#222">ymm0</text>
  <text x="461" y="122" text-anchor="middle" fill="#222">bits 128–255</text>
  <rect x="537" y="144" width="153" height="34" fill="#d9ead3" stroke="#222"/>
  <text x="70" y="166" text-anchor="end" fill="#222">xmm0</text>
  <text x="613" y="166" text-anchor="middle" fill="#222">128 bits</text>
  <line x1="537" y1="100" x2="537" y2="134" stroke="#222" stroke-dasharray="4,3"/>
  <text x="40" y="208" fill="#222">VEX write to xmm0 (vaddps xmm0, …): everything above bit 127 becomes 0.</text>
  <text x="40" y="230" fill="#222">Legacy SSE write to xmm0 (addps xmm0, …): everything above bit 127 is left as it was.</text>
</svg>
