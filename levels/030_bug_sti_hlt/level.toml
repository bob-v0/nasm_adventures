hints = [
  "Where is the CPU when it hangs? Not in the handler: in hlt, with the request completed and done already set. Which interrupt was supposed to wake it, and when did it arrive? Try witnesses from the list of failing delays in the test report.",
  "If the completion interrupt arrives after `cmp byte [done], 0` but before `hlt`, the check already said 'not done', and hlt waits for the next interrupt, which never comes: there's only one per request. Level 79 had the same lost wakeup between threads.",
  "Make the check and the sleep one unit: cli before the check, then `sti` immediately followed by `hlt`. sti enables interrupts only after the instruction that follows it, so an interrupt that is already pending is taken when hlt has started, and wakes it. Remember sti on the way out too.",
]

