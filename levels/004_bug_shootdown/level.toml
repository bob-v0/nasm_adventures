hints = [
  "A torn snapshot means a reader saw the page change while it read: its words from two rounds. Which frame was that reader reading? Which round was the first CPU filling at that moment, and which frame?",
  "After shoot_down returns, the first CPU treats the old frame as free and, next round, fills it. But shoot_down only *sent* the IPI. A reader with interrupts off (in the middle of a snapshot) hasn't taken it yet: its TLB still maps WINDOW to the old frame, the one now being overwritten.",
  "Freeing must wait until every CPU has really dropped the old translation: the handlers count themselves in [acks]; wait in shoot_down until [acks] + 1 = [cpus] (pause in the loop). A reader then finishes its snapshot, takes the IPI, flushes, acknowledges, and only then is the frame reused.",
]

