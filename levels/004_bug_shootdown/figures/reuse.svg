<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 200" width="740" height="200" role="img">
<title>CPU 0 reuses the old frame while CPU 1, interrupts off, still reads it through its stale TLB</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker></defs>
<rect x="0" y="0" width="740" height="200" fill="#ffffff"/>
<text x="20" y="48" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">CPU 0</text>
<text x="20" y="128" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">CPU 1</text>
<rect x="90" y="32" width="150" height="26" rx="4" fill="#dbeafe" stroke="#1d4ed8"/>
<text x="165" y="50" font-family="monospace" font-size="11" text-anchor="middle" fill="#222222">WINDOW → B; IPI</text>
<rect x="260" y="32" width="200" height="26" rx="4" fill="#f6d0cc" stroke="#b8322a"/>
<text x="360" y="50" font-family="monospace" font-size="11" text-anchor="middle" fill="#222222">next round: fill A</text>
<rect x="90" y="112" width="420" height="26" rx="4" fill="#ffedd5" stroke="#c2410c"/>
<text x="300" y="130" font-family="monospace" font-size="11" text-anchor="middle" fill="#222222">snapshot, interrupts off: reading A (its TLB: WINDOW → A)</text>
<rect x="520" y="112" width="190" height="26" rx="4" fill="#dcfce7" stroke="#15803d"/>
<text x="615" y="130" font-family="monospace" font-size="11" text-anchor="middle" fill="#222222">IPI: invlpg, ack</text>
<path d="M360,60 L360,108" stroke="#b8322a" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="368" y="90" font-family="sans-serif" font-size="11" fill="#b8322a">writes under its feet: torn</text>
<text x="20" y="186" font-family="sans-serif" font-size="12" fill="#555555">Wait for every ack before reusing A: then CPU 1 has finished its snapshot and flushed.</text>
</svg>
