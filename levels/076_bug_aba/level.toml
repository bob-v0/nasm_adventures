hints = [
  "pop reads top (A) and A.next (B), then CASes top from A to B. What if, between the read and the CAS, others pop A, pop B, and push A back? top is A again, so the CAS succeeds and B becomes the top, while someone else owns B.",
  "The CAS asks 'is top still A?', but the question that matters is 'has top changed since I read it?'. A pointer can't tell; a counter can.",
  "Make the stack's head 16 bytes, { top, version }, and change both at once with lock cmpxchg16b (rdx:rax = what you read, rcx:rbx = { new top, version + 1 }). Every push and pop bumps the version. Save rbx (it's callee-saved)!",
]

