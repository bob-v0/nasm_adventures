<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" font-family="sans-serif" font-size="14">
  <rect width="720" height="250" fill="#ffffff"/>
  <text x="360" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">A double: 64 bits, three fields</text>
  <g font-family="monospace" font-size="12" fill="#555">
    <text x="31" y="52" text-anchor="middle">63</text>
    <text x="60" y="52" text-anchor="middle">62</text>
    <text x="196" y="52" text-anchor="middle">52</text>
    <text x="226" y="52" text-anchor="middle">51</text>
    <text x="690" y="52" text-anchor="middle">0</text>
  </g>
  <rect x="16" y="60" width="30" height="44" fill="#f4c7c3" stroke="#222"/>
  <rect x="46" y="60" width="165" height="44" fill="#c9daf8" stroke="#222"/>
  <rect x="211" y="60" width="493" height="44" fill="#d9ead3" stroke="#222"/>
  <text x="31" y="87" text-anchor="middle" fill="#222">s</text>
  <text x="128" y="81" text-anchor="middle" fill="#222">exponent e</text>
  <text x="128" y="98" text-anchor="middle" font-size="12" fill="#444">11 bits, bias 1023</text>
  <text x="457" y="81" text-anchor="middle" fill="#222">fraction f</text>
  <text x="457" y="98" text-anchor="middle" font-size="12" fill="#444">52 bits, after an implicit "1."</text>
  <text x="360" y="136" text-anchor="middle" font-size="15" fill="#222">value = (−1)^s × 1.f × 2^(e − 1023)     (normal numbers: e = 1 … 2046)</text>
  <text x="16" y="172" fill="#222" font-weight="bold">Example: 3.0 = 0x4008000000000000</text>
  <g font-family="monospace" font-size="14" fill="#222">
    <rect x="16" y="184" width="30" height="30" fill="#f4c7c3" stroke="#222"/>
    <text x="31" y="204" text-anchor="middle">0</text>
    <rect x="46" y="184" width="165" height="30" fill="#c9daf8" stroke="#222"/>
    <text x="128" y="204" text-anchor="middle">10000000000</text>
    <rect x="211" y="184" width="493" height="30" fill="#d9ead3" stroke="#222"/>
    <text x="457" y="204" text-anchor="middle">1000 0000 0000 … 0000</text>
  </g>
  <g font-size="13" fill="#333">
    <text x="31" y="236" text-anchor="middle">+</text>
    <text x="128" y="236" text-anchor="middle">e = 1024 → × 2^1</text>
    <text x="457" y="236" text-anchor="middle">1.f = 1.1 in binary = 1.5;   1.5 × 2 = 3.0</text>
  </g>
</svg>
