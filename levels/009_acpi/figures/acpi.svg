<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 170" width="740" height="170" role="img">
<title>The RSDP points to the root table, which lists the MADT among other tables</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker></defs>
<rect x="0" y="0" width="740" height="170" fill="#ffffff"/>
<rect x="20" y="30" width="190" height="80" rx="6" fill="#eeeeee" stroke="#888888" stroke-width="1.5"/>
<text x="115" y="56" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">RSDP</text>
<text x="115" y="76" font-family="monospace" font-size="12" text-anchor="middle" fill="#222222">"RSD PTR "</text>
<text x="115" y="96" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#555555">0xE0000-0xFFFFF</text>
<path d="M212,70 L272,70" stroke="#555555" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="275" y="30" width="190" height="80" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="370" y="56" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">XSDT / RSDT</text>
<text x="370" y="76" font-family="monospace" font-size="12" text-anchor="middle" fill="#222222">the root table</text>
<text x="370" y="96" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#555555">a list of tables</text>
<path d="M467,70 L527,70" stroke="#555555" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="530" y="30" width="190" height="80" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
<text x="625" y="56" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">MADT</text>
<text x="625" y="76" font-family="monospace" font-size="12" text-anchor="middle" fill="#222222">"APIC"</text>
<text x="625" y="96" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#555555">CPUs, I/O APICs</text>
<text x="20" y="140" font-family="sans-serif" font-size="12" fill="#555555">Search only for the RSDP (and check its checksum); from there, every table is a pointer away.</text>
<text x="20" y="158" font-family="sans-serif" font-size="12" fill="#555555">The root table lists others too (FACP, HPET, MCFG on q35…): match the 4-letter signature.</text>
</svg>
