hints = [
  "The RSDP starts with the 8 characters \"RSD PTR \" on a 16-byte boundary, either in the first KiB of the EBDA (its segment is the word at 0x40E) or between 0xE0000 and 0xFFFFF; its first 20 bytes must add up to 0 (mod 256). Byte 15 is the revision: 2 or more means the XSDT (address at +24, 8-byte entries), else the RSDT (address at +16, 4-byte entries).",
  "Every table starts with a 36-byte header: the signature (4 characters), then its length (dword at +4). The root table's entries, after its header, are the addresses of the other tables: find the one whose signature is \"APIC\", the MADT. Its entries start at +44: a type byte, a length byte, then the rest; step by the length.",
  "Type 0, a processor: APIC id at +3, flags at +4 (bit 0: enabled; a machine with room for more CPUs lists absent ones disabled). Type 1, an I/O APIC: id at +2, address at +4, GSI base at +8. Type 2, an interrupt override: the ISA IRQ at +3, the GSI it really arrives on at +4, flags (word) at +8. Count the enabled CPUs in a first pass: their number comes first.",
]

