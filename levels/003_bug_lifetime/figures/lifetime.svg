<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 200" width="740" height="200" role="img">
<title>A reader is already on the node when the writer unlinks and frees it</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker></defs>
<rect x="0" y="0" width="740" height="200" fill="#ffffff"/>
<rect x="40" y="40" width="120" height="44" rx="5" fill="#eeeeee" stroke="#888888" stroke-width="1.5"/>
<text x="100" y="67" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#222222">head</text>
<rect x="220" y="40" width="120" height="44" rx="5" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="280" y="67" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#222222">node 1</text>
<rect x="400" y="40" width="120" height="44" rx="5" fill="#f6d0cc" stroke="#b8322a" stroke-width="1.5"/>
<text x="460" y="67" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#222222">node 2</text>
<rect x="580" y="40" width="120" height="44" rx="5" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="640" y="67" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#222222">node 3</text>
<path d="M160,62 L216,62" stroke="#555555" stroke-width="1.4" marker-end="url(#arr)"/>
<path d="M340,52 C 420,24 500,24 576,52" fill="none" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="460" y="20" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#1d4ed8">unlinked: new walks skip node 2</text>
<path d="M340,72 L396,72" stroke="#888888" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr)"/>
<text x="460" y="118" font-family="monospace" font-size="12" text-anchor="middle" fill="#b8322a">↑ a reader, already here</text>
<text x="460" y="136" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#555555">free it now: the reader reads poison</text>
<text x="20" y="170" font-family="sans-serif" font-size="12" fill="#555555">Grace period: wait until every reader has finished a walk (a quiescent state), then free.</text>
<text x="20" y="188" font-family="sans-serif" font-size="12" fill="#555555">Any walk that could have reached node 2 started before the unlink, so it is over by then.</text>
</svg>
