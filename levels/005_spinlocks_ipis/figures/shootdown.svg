<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 210" width="740" height="210" role="img">
<title>A TLB shootdown: CPU 0 changes the entry, sends an IPI, the others invlpg and acknowledge</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker></defs>
<rect x="0" y="0" width="740" height="210" fill="#ffffff"/>
<text x="20" y="44" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">CPU 0</text>
<line x1="80" y1="40" x2="720" y2="40" stroke="#bbbbbb"/>
<text x="20" y="104" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">CPU 1</text>
<line x1="80" y1="100" x2="720" y2="100" stroke="#bbbbbb"/>
<text x="20" y="154" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">CPU 2</text>
<line x1="80" y1="150" x2="720" y2="150" stroke="#bbbbbb"/>
<rect x="90" y="28" width="150" height="24" rx="4" fill="#dbeafe" stroke="#1d4ed8"/>
<text x="165" y="45" font-family="monospace" font-size="11" text-anchor="middle" fill="#222222">PTE = new; invlpg</text>
<path d="M260,44 L300,88" stroke="#c2410c" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="304" y="88" width="120" height="24" rx="4" fill="#ffedd5" stroke="#c2410c"/>
<text x="364" y="105" font-family="monospace" font-size="11" text-anchor="middle" fill="#222222">invlpg; ack</text>
<path d="M426,94 L496,52" stroke="#15803d" stroke-width="1.3" marker-end="url(#arr)"/>
<path d="M260,44 L300,138" stroke="#c2410c" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="304" y="138" width="120" height="24" rx="4" fill="#ffedd5" stroke="#c2410c"/>
<text x="364" y="155" font-family="monospace" font-size="11" text-anchor="middle" fill="#222222">invlpg; ack</text>
<path d="M426,144 L496,52" stroke="#15803d" stroke-width="1.3" marker-end="url(#arr)"/>
<text x="262" y="72" font-family="monospace" font-size="11" fill="#c2410c">IPI</text>
<rect x="500" y="28" width="200" height="24" rx="4" fill="#dcfce7" stroke="#15803d"/>
<text x="600" y="45" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#222222">all acked: carry on</text>
<text x="20" y="196" font-family="sans-serif" font-size="12" fill="#555555">Until every ack is in, some CPU may still use the old translation: don't reuse the old frame before then (level 4).</text>
</svg>
