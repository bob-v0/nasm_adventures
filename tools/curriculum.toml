# The full curriculum, in play order (first entry = highest level number).
# `tools/gen_curriculum.py` numbers the levels and regenerates DESIGN.md §5.
#   bug  = difficulty tier of a bug level: 1 (easy) .. 4 (very hard)
#   boss = true for the level that closes an arc
#   dir  = implemented level directory under levels/ (if any)

[[arc]]
id = "I"
name = "The Assembler & the Machine"
runner = "emu (fragment levels), then emu (whole programs)"
levels = [
  { title = "Hello, NASM", dir = "hello_nasm", concepts = "what an assembler does, NASM line format, comments, `mov reg, imm`, listings", gate = "Load given constants into rax and rbx" },
  { title = "Sixteen Registers", dir = "registers", concepts = "the 16 GPRs, `mov reg, reg`, `xchg`", gate = "Rotate four registers (stretch: 3 instructions)" },
  { title = "Speaking in Numbers", dir = "literals", concepts = "bases; NASM literals: `0x`, `h`, `0b`, `0o`, `_`, character constants, -1", gate = "Load six values written in six notations" },
  { title = "Nested Registers", dir = "partial_registers", concepts = "al/ah/ax/eax views, 32-bit zero-extension rule, `movzx`, `movsx`, `movsxd`", gate = "Derive six zero/sign-extended views of one value" },
  { title = "Names for Places", dir = "data_and_labels", concepts = "sections, `db/dw/dd/dq`, `resb/resq`, labels are addresses, `label` vs `[label]`, size specifiers", gate = "Define data and .bss, copy memory via a register, sized stores" },
  { title = "The Assembler Counts", dir = "assembler_arithmetic", concepts = "assemble time vs run time, `equ`, `$`, `$$`, `times`, `%define`, `%assign`, `%rep`", gate = "Generate tables and constants with no run-time arithmetic" },
  { title = "Backwards Bytes", dir = "little_endian", concepts = "little-endian memory, network byte order, `bswap`, `xchg al, ah`", gate = "Decode a big-endian packet header" },
  { title = "The Address Machine", dir = "effective_addresses", concepts = "`[base + index*scale + disp]`, 2D arrays, `lea` as arithmetic", gate = "Index an 8×8 grid without `add` or `mul`" },
  { title = "Asking the Kernel", dir = "first_syscall", concepts = "whole programs: `global _start`, `%include`; user mode vs kernel; syscall convention; `exit`; falling off the end", gate = "Exit with a status read from memory" },
  { title = "Speak", dir = "speak", concepts = "file descriptors, `write`, return values, backquoted strings", gate = "Write to stdout and stderr; exit with a syscall's result" },
  { title = "Debugger Eyes", dir = "debugger_eyes", concepts = "objdump, `ring debug` (incl. stepping backwards), gdb basics", gate = "Recover a per-player key that exists only in a register for one instruction" },
  { title = "Garbage in the High Bits", dir = "bug_high_bits", bug = 1, concepts = "first bug hunt: partial-register writes leave stale upper bits", gate = "Fix a checksum program in ≤ 2 changed lines" },
  { title = "Clobbered by the Kernel", dir = "bug_clobbered", bug = 1, concepts = "`syscall` destroys rcx and r11; caller-owned state", gate = "Fix a program that keeps state in rcx across syscalls, in ≤ 3 changed lines" },
  { title = "Echo Chamber", dir = "echo_chamber", boss = true, concepts = "`read`, .bss buffers, everything in the arc", gate = "Read 8 bytes, echo them reversed, exit with the byte count" },
]

[[arc]]
id = "II"
name = "Arithmetic & Flags"
runner = "emu"
levels = [
  { title = "Add & Subtract", dir = "add_subtract", concepts = "`add`, `sub`, `inc`, `dec`, `neg`; arithmetic is modulo 2⁶⁴", gate = "Five results from three inputs, wrap-around included" },
  { title = "The Flags Register", dir = "flags", concepts = "CF, ZF, SF, OF (and PF, AF); which instructions set which flags", gate = "Predict the flags of eight operations, then make the CPU end in a given flag state" },
  { title = "The Carry Flag", dir = "carry", concepts = "`adc`, `sbb`, `clc`, `stc`; multi-word arithmetic", gate = "128-bit add and subtract; the final CF is checked" },
  { title = "Compare & Jump", dir = "compare_jump", concepts = "`cmp`, `test`, `jmp`, `jcc` (above/below vs greater/less), NASM local labels", gate = "`clamp(x, lo, hi)`, signed and unsigned" },
  { title = "Signed vs Unsigned", dir = "signed_unsigned", concepts = "two's complement, CF vs OF, `jc`/`jo`", gate = "Detect unsigned and signed overflow of add and sub; compare both ways" },
  { title = "Multiplication", dir = "multiplication", concepts = "`mul`, `imul` (1/2/3 operands), rdx:rax", gate = "64×64→128, signed overflow detection, multiply by a constant" },
  { title = "Division", dir = "division", concepts = "`div`, `idiv`, `cqo`, truncation vs floor, #DE", gate = "C-style and Python-style signed division" },
  { title = "Signed or Unsigned?", dir = "bug_signedness", bug = 1, concepts = "`ja` vs `jg`, `div` vs `idiv` + `cqo`, `movzx` vs `movsx`", gate = "Find and fix four sign bugs in ≤ 4 changed lines; hidden tests use boundary values" },
  { title = "Bitwise Logic", dir = "bitwise", concepts = "`and`, `or`, `xor`, `not`, `test`, masks, the `xor reg, reg` idiom, imm32 sign-extension", gate = "Page-align addresses with masks" },
  { title = "Shifts & Rotates", dir = "shifts", concepts = "`shl/shr/sar`, `rol/ror`, counts in `cl`, `shld/shrd`", gate = "Pack RGB565 and shift a 128-bit value by 0–127" },
  { title = "Bit Surgery", dir = "bit_surgery", concepts = "`bt/bts/btr/btc` on memory bit strings, `popcnt`, `bsf/bsr`, `tzcnt/lzcnt`", gate = "Operate on two 256-bit sets in memory" },
  { title = "Strength Reduction", dir = "strength_reduction", concepts = "`lea` arithmetic, shifts as multiply/divide, division by a constant via multiply", gate = "Divide by 10 without `div`" },
  { title = "Silent Overflow", dir = "bug_silent_overflow", bug = 2, concepts = "wrap-around in size computations, checking CF after `mul`/`add`", gate = "A size check is fooled by wrap-around: give a witness input, then fix it" },
  { title = "Bignum", dir = "bignum", boss = true, concepts = "multi-limb arithmetic with carries, loops from jumps", gate = "Multiply two numbers of up to 512 bits" },
]

[[arc]]
id = "III"
name = "Control Flow & Data"
runner = "emu"
levels = [
  { title = "Loops", dir = "loops", concepts = "counted and conditional loops, zero-trip loops, `loop` (and why not to use it)", gate = "Sum, maximum and a threshold count over an array" },
  { title = "Branchless", dir = "branchless", concepts = "`cmovcc`, `setcc`, mask arithmetic", gate = "abs/min/max/sign/equality with zero jumps" },
  { title = "Numbers to Text", dir = "itoa", library = "itoa", concepts = "`itoa`: digits by repeated division, unsigned/signed/hex", gate = "Format any 64-bit integer three ways → library: `itoa`" },
  { title = "Text to Numbers", dir = "atoi", library = "atoi", concepts = "`atoi`: parsing, validation, overflow detection", gate = "Parse decimal/hex/signed text with error codes → library: `atoi`" },
  { title = "String Instructions", dir = "string_instructions", concepts = "`movs/stos/scas/cmps`, `rep`/`repe`/`repne`, DF and `cld`", gate = "`memcpy`, `memset`, `strlen`, `memcmp`" },
  { title = "Off by One", dir = "bug_off_by_one", bug = 1, concepts = "fencepost errors, inclusive vs exclusive bounds, a stale DF", gate = "Fix three routines that each touch one element too many or too few" },
  { title = "Jump Tables", dir = "jump_tables", concepts = "`jmp [table + rax*8]`, tables of labels, bounds checks", gate = "Interpret a tiny stack-machine bytecode" },
  { title = "Searching", dir = "searching", concepts = "binary search, invariants, unsigned midpoints", gate = "Lower-bound search within an O(log n) step budget" },
  { title = "Sorting", dir = "sorting", concepts = "insertion sort, in-place swaps, signed comparisons", gate = "Sort up to 200 signed integers" },
  { title = "Structs", dir = "structs", concepts = "`struc`/`endstruc`, `istruc`/`at`/`iend`, field offsets, alignment", gate = "Walk and extend a linked list of records" },
  { title = "Bit Tricks", dir = "bit_tricks", concepts = "x & -x, x & (x-1), powers of two, parity, branch-free tricks", gate = "Six micro-puzzles, no jumps, tight budget" },
  { title = "Hashing", dir = "hashing", concepts = "FNV-1a, the SSE4.2 `crc32` instruction", gate = "Hash a string two ways" },
  { title = "Assumed Zero", dir = "bug_assumed_zero", bug = 2, concepts = "uninitialized registers and memory; from here on the grader poisons initial state", gate = "A routine that only works when registers start at 0; make it robust" },
  { title = "The Interpreter", dir = "interpreter", boss = true, concepts = "everything in the arc", gate = "A Brainf*** interpreter" },
]

[[arc]]
id = "IV"
name = "Stack & Procedures"
runner = "emu in function mode (the game calls your functions); native for the libc levels"
levels = [
  { title = "The Stack", dir = "stack", concepts = "`push`, `pop`, rsp, last-in first-out", gate = "Reverse a string and check brackets with the stack" },
  { title = "Call & Return", dir = "call_return", library = "print_uint", concepts = "`call`, `ret`, return addresses, functions calling functions", gate = "A `print_uint` function built from a helper → library" },
  { title = "System V ABI", dir = "abi", concepts = "argument/return registers, caller- vs callee-saved registers", gate = "Keep values alive across a call that clobbers every caller-saved register" },
  { title = "Stack Alignment", dir = "stack_alignment", concepts = "the 16-byte rule at `call`, locals with `sub rsp`, the red zone", gate = "Call a helper that checks alignment, from varying stack depths" },
  { title = "Stack Frames", dir = "stack_frames", concepts = "`rbp` frames, locals, `enter`/`leave`, walking the frame chain", gate = "Write a backtrace of your callers' return addresses" },
  { title = "Broken Contract", dir = "bug_broken_contract", bug = 2, concepts = "ABI violations: clobbered callee-saved registers, a misaligned stack", gate = "Fix a library that works alone but breaks its callers" },
  { title = "Hello, libc", dir = "hello_libc", concepts = "`extern printf`, linking with gcc, `main`, varargs and `al`", gate = "A formatted table via printf (runs natively)" },
  { title = "Called from C", dir = "called_from_c", concepts = "exporting symbols, C prototypes, pointers and sizes across the boundary", gate = "A C-callable API and a qsort comparator (runs natively)" },
  { title = "Recursion", dir = "recursion", concepts = "recursive calls, stack depth, what each frame holds", gate = "Towers of Hanoi, recording every move" },
  { title = "Unchecked Length", dir = "bug_unchecked_length", bug = 2, concepts = "copying without a bounds check corrupts neighbouring data", gate = "A long input overwrites the next field of a record: show it with a witness, then bound the copy" },
  { title = "Dangling Frame", dir = "bug_dangling_frame", bug = 2, concepts = "lifetime: pointers to a callee's locals die at `ret`", gate = "Fix a function that returns a pointer into its own stack frame" },
  { title = "Callbacks", dir = "callbacks", concepts = "function pointers, `call reg`, calling back into the caller's code", gate = "Generic map/filter/reduce" },
  { title = "Macros", dir = "macros", concepts = "`%macro`, parameters, `%%` local labels, `%include` libraries", gate = "A small macro language for system calls" },
  { title = "Coroutines", dir = "coroutines", concepts = "saving and switching stacks, resuming where you left off", gate = "Generators with your own context switch (reused in Arc VI)" },
  { title = "Calculator", dir = "calculator", boss = true, concepts = "everything in the arc", gate = "A recursive-descent expression evaluator" },
]

[[arc]]
id = "V"
name = "Linux Userland"
runner = "emu with the game's emulated Linux kernel (files, memory, signals, processes, fault injection); native for PIE, dynamic linking and hand-made ELF"
levels = [
  { title = "Files", dir = "files", concepts = "`open`, `read`, `write`, `close`, read loops, -errno results", gate = "Copy a file, count its lines, report a missing file" },
  { title = "argv, envp, auxv", dir = "argv", concepts = "the initial stack at `_start`: argc, argv, envp, the auxiliary vector", gate = "Print the arguments, $HOME and the page size" },
  { title = "Heap", dir = "heap", library = "malloc", concepts = "`brk`, `mmap`, block headers, free lists, alignment", gate = "A malloc/free that survives a workload and reuses memory" },
  { title = "Short Reads, Short Writes", dir = "bug_short_io", bug = 2, concepts = "`read`/`write` may transfer less than asked", gate = "A copier that works on files but loses data through pipes" },
  { title = "Ignored Errors", dir = "bug_ignored_errors", bug = 2, concepts = "negative rax used as an fd or a length, leaked file descriptors", gate = "Handle every failure; the kernel injects them" },
  { title = "Use After Free", dir = "bug_use_after_free", bug = 2, concepts = "use-after-free and double free; poisoning and quarantine", gate = "The game's checked allocator catches both; fix the program" },
  { title = "Processes", dir = "processes", concepts = "`fork`, `execve`, `wait4`, exit statuses", gate = "Run commands and report how they exited" },
  { title = "Pipes & dup", dir = "pipes", concepts = "`pipe2`, `dup2`, closing the ends you don't use", gate = "Implement `a | b`" },
  { title = "Signals", dir = "signals", concepts = "`rt_sigaction`, `SA_RESTORER`, `rt_sigreturn`, the signal frame", gate = "Handle SIGINT, and recover from SIGSEGV by editing the saved context" },
  { title = "Reentrant Signal Handler", dir = "bug_reentrant_handler", bug = 3, concepts = "reentrancy: a handler interrupts the code it calls; errno and shared buffers", gate = "Make a handler async-signal-safe; the kernel delivers the signal at every instruction" },
  { title = "Time", dir = "time", concepts = "`clock_gettime`, `nanosleep`, the vDSO", gate = "A stopwatch and a rate limiter" },
  { title = "Time of Check, Time of Use", dir = "bug_toctou", bug = 3, concepts = "logical race with another process: check-then-use on file paths", gate = "Show the race with a witness schedule, then fix with `openat`/`O_NOFOLLOW`/`fstat`" },
  { title = "Position Independence", dir = "pie", concepts = "RIP-relative addressing, PIE, `default rel`, relocations", gate = "Build a PIE that passes a relocation audit (native)" },
  { title = "Dynamic Linking", dir = "dynamic_linking", concepts = "the GOT, the PLT, lazy binding, `ld.so`", gate = "Call libc through the GOT yourself (native)" },
  { title = "ELF by Hand", dir = "elf_by_hand", concepts = "ELF64 headers and program headers with `nasm -f bin`", gate = "The smallest valid ELF that exits 42 (native)" },
  { title = "Directories & mmap", dir = "directories_mmap", concepts = "`getdents64`, file-backed `mmap`", gate = "Walk a directory tree and count words in mapped files" },
  { title = "Tiny Shell", dir = "tiny_shell", boss = true, concepts = "everything in the arc", gate = "A shell with pipes, redirection, `cd` and exit statuses" },
]

[[arc]]
id = "VI"
name = "Events, Tasks & Actors (one thread)"
runner = "emu with the game's kernel: sockets with scripted clients, epoll, timers and virtual time, so every schedule is reproducible"
levels = [
  { title = "Non-blocking I/O", dir = "nonblocking_io", concepts = "`O_NONBLOCK`, EAGAIN", gate = "Serve two pipes without blocking on either" },
  { title = "Event Loop", dir = "event_loop", concepts = "`epoll_create1`, `epoll_ctl`, `epoll_wait`", gate = "Echo server for many clients" },
  { title = "Timers", dir = "timers", concepts = "`timerfd`, timer wheels", gate = "Timeouts on idle connections" },
  { title = "Tasks & Await", dir = "tasks_await", concepts = "coroutines (from Arc IV) as tasks; await = yield to the loop until ready", gate = "Rewrite the echo server as straight-line tasks" },
  { title = "Channels", dir = "channels", concepts = "bounded queues, backpressure, wakers", gate = "Producer/consumer tasks with a bounded channel" },
  { title = "Reentrancy at Await Points", dir = "bug_await_reentrancy", bug = 3, concepts = "state read before an await is stale after it; invariants across suspension", gate = "A bank of tasks loses money only under certain interleavings; the grader explores task schedules" },
  { title = "Lost Wakeup", dir = "bug_lost_wakeup", bug = 3, concepts = "a waker registered after the event already fired; check-then-wait", gate = "Fix a channel whose consumers sometimes sleep forever" },
  { title = "Cancellation Leak", dir = "bug_cancellation_leak", bug = 3, concepts = "a task cancelled at an await while holding a lock or buffer", gate = "Make cancellation release everything; the grader cancels at every await" },
  { title = "Actors", dir = "actors", concepts = "actors with mailboxes, message ownership", gate = "An actor-based chat room" },
  { title = "Actor Lifetimes", dir = "bug_actor_lifetimes", bug = 3, concepts = "lifetime across actors: an actor freed while messages addressed to it (or borrowed from it) are in flight", gate = "Fix with ownership transfer and generation-checked handles" },
  { title = "Async Chat Server", dir = "async_chat", boss = true, concepts = "everything in the arc", gate = "Chat server that survives schedule exploration, cancellation and slow clients" },
]

[[arc]]
id = "VII"
name = "Performance & Microarchitecture"
runner = "emu with the game's CPU model (ring/perf.py): deterministic cycle counts, the same on every machine"
levels = [
  { title = "Measuring", dir = "measuring", concepts = "`rdtsc`, `rdtscp`, `lfence`, variance", gate = "A reliable micro-benchmark harness" },
  { title = "Pipelines", dir = "pipelines", concepts = "latency vs throughput, dependency chains", gate = "Multiple accumulators" },
  { title = "Branch Prediction", dir = "branch_prediction", concepts = "predictable vs random branches", gate = "Hit a cycles/element budget on random data" },
  { title = "Caches", dir = "caches", concepts = "lines, sets, strides, alignment", gate = "Cache-blocked transpose" },
  { title = "Prefetch & TLB", dir = "prefetch_tlb", concepts = "`prefetcht0`, huge pages", gate = "Faster linked-list traversal: many misses in flight" },
  { title = "Instruction Selection", dir = "instruction_selection", concepts = "uops, macro-fusion, partial-register stalls", gate = "Speed up a hot loop ≥ 2×" },
  { title = "Performance Cliff", dir = "bug_performance_cliff", bug = 2, concepts = "performance bugs: 4K aliasing, cache-line splits, denormals", gate = "Find why one input size is 20× slower per element and fix it" },
  { title = "Fast Hash Map", dir = "fast_hash_map", boss = true, concepts = "everything in the arc", gate = "Open-addressing map under 50 cycles per operation on every kind of key" },
]

[[arc]]
id = "VIII"
name = "Threads & the Memory Model"
runner = "emu: threads share one emulated CPU under the game's scheduler (numbered, replayable schedules), an x86-TSO store-buffer model, and the CPU model for false sharing"
levels = [
  { title = "Threads", dir = "threads", concepts = "`clone` with your own stacks, `futex` join", gate = "N threads summing ranges" },
  { title = "Atomics", dir = "atomics", concepts = "`lock` prefix, `xadd`, `xchg`, `cmpxchg`", gate = "A correct shared counter" },
  { title = "Data Race", dir = "bug_data_race", bug = 2, concepts = "`inc [counter]` is read-modify-write; lost updates", gate = "Make the race visible with a witness schedule, then fix it" },
  { title = "Torn Read", dir = "bug_torn_read", bug = 2, concepts = "non-atomic 128-bit and cache-line-split accesses; `cmpxchg16b`", gate = "Fix a two-word snapshot that sometimes mixes old and new halves" },
  { title = "Locks", dir = "locks", concepts = "spinlock with `xchg` + `pause`, futex mutex", gate = "A mutex that sleeps instead of spinning" },
  { title = "Logical Race", dir = "bug_logical_race", bug = 3, concepts = "every access is atomic and it is still wrong: check-then-act, invariants spanning two variables", gate = "Fix a rate limiter and a bank transfer" },
  { title = "Deadlock", dir = "bug_deadlock", bug = 2, concepts = "lock ordering, cycles in the wait-for graph", gate = "The grader finds the deadlocking schedule; impose an order" },
  { title = "Livelock & Starvation", dir = "bug_starvation", bug = 3, concepts = "unfair spinlocks, polite livelock", gate = "Replace with a ticket lock; bounded waiting is checked" },
  { title = "Memory Ordering", dir = "memory_ordering", concepts = "x86-TSO: store buffers, store→load reordering, `mfence`", gate = "Witness a store-buffer reordering in the TSO model; forbid it with fences" },
  { title = "Ordering Violation", dir = "bug_ordering_violation", bug = 3, concepts = "Dekker/Peterson broken by store→load reordering", gate = "Witness both threads entering the critical section; fix with the minimum fences" },
  { title = "Weakly-Ordered Stores", dir = "bug_weak_stores", bug = 3, concepts = "non-temporal stores (`movnti`) escape TSO; publishing a flag before the data", gate = "Fix a producer/consumer that publishes garbage; `sfence` placement" },
  { title = "Condition Variables", dir = "condition_variables", concepts = "futex wait/wake, predicate loops", gate = "Bounded blocking queue" },
  { title = "Lost Wakeup II", dir = "bug_lost_wakeup_futex", bug = 3, concepts = "check-then-sleep without the futex value comparison", gate = "Consumers that hang in a few schedules out of a hundred; witness, fix, and pass the schedule search" },
  { title = "False Sharing", dir = "bug_false_sharing", bug = 2, concepts = "performance bug: unrelated data on one cache line", gate = "Per-thread counters 10× slower than expected; fix with padding" },
  { title = "Lock-Free Stack", dir = "lock_free_stack", concepts = "Treiber stack with `cmpxchg`", gate = "Push/pop under contention" },
  { title = "ABA", dir = "bug_aba", bug = 4, concepts = "a pointer compares equal but the node was freed and reused", gate = "Witness the ABA schedule; fix with tagged pointers and `cmpxchg16b`" },
  { title = "Memory Reclamation", dir = "bug_memory_reclamation", bug = 4, concepts = "freeing nodes other threads may still read; hazard pointers, epoch-based reclamation", gate = "Lock-free stack with hazard pointers; the checked allocator watches every access" },
  { title = "Actors Across Threads", dir = "actors_threads", concepts = "a multi-threaded actor runtime, MPSC mailboxes, work stealing", gate = "Mailboxes and scheduling for actors on several worker threads" },
  { title = "Lifetimes Across Actors", dir = "bug_actor_lifetimes_threads", bug = 4, concepts = "an actor released by one worker while another still dispatches to it; refcount release ordering", gate = "Fix the reference counts: atomic, with decrement-and-test as one step" },
  { title = "Lock-Free Actor Runtime", boss = true, concepts = "everything in the arc", gate = "Passes schedule exploration, the TSO model, the race detector and a native stress test" },
]

[[arc]]
id = "IX"
name = "Floating Point & SIMD"
runner = "native (CPU features detected; emulated if missing)"
levels = [
  { title = "IEEE 754", concepts = "sign/exponent/mantissa, NaN, inf, denormals", gate = "Decode doubles without FP instructions" },
  { title = "x87 (Museum)", concepts = "FPU stack, control word", gate = "sqrt and sin with x87" },
  { title = "SSE Scalar", concepts = "`movsd`, `addsd`, `cvtsi2sd`, `ucomisd`, MXCSR", gate = "Print a double → library: `dtoa`" },
  { title = "Precision Lost", bug = 2, concepts = "catastrophic cancellation, NaN compares (`ucomisd` sets PF), float equality", gate = "Fix a geometry routine that fails on near-degenerate inputs" },
  { title = "SIMD Integers", concepts = "xmm, `padd*`, saturation", gate = "Brighten an image 16 px at a time" },
  { title = "Shuffles", concepts = "`pshufd`, `pshufb`, `punpck*`, `palignr`", gate = "Byte-reverse/transpose with shuffles" },
  { title = "Masks & Compares", concepts = "`pcmpeqb`, `pmovmskb`, `tzcnt`", gate = "SIMD `strlen`/`memchr`" },
  { title = "Tail Overrun", bug = 2, concepts = "vector loads past the end of a buffer into an unmapped page", gate = "Fix a SIMD strlen that crashes on page boundaries" },
  { title = "Packed Floats", concepts = "`mulps`, horizontal sums, alignment", gate = "Dot product" },
  { title = "AVX & VEX", concepts = "ymm, 3-operand form, `vzeroupper`, feature detection", gate = "AVX with runtime dispatch" },
  { title = "FMA", concepts = "`vfmadd231ps`, precision", gate = "Polynomial exp within a ULP bound" },
  { title = "Gathers & Permutes", concepts = "`vpgatherdd`, `vpermd`", gate = "Vectorized histogram" },
  { title = "AVX-512", concepts = "zmm, mask registers, `vpcompressd`", gate = "Filter by predicate" },
  { title = "SIMD Gauntlet", boss = true, concepts = "everything in the arc", gate = "UTF-8 validator at ≥ 4 GB/s" },
]

[[arc]]
id = "X"
name = "Machine Code"
runner = "native"
levels = [
  { title = "Encoding I", concepts = "opcode, ModRM, SIB, displacement, immediate", gate = "Hand-encode 20 instructions with `db`" },
  { title = "Encoding II", concepts = "REX, prefixes, VEX", gate = "Hand-encode 64-bit and SSE instructions" },
  { title = "Decoder", concepts = "instruction-length decoding", gate = "Length decoder for a subset" },
  { title = "Disassembler", concepts = "operand formatting, relative targets", gate = "Disassemble a blob to NASM syntax" },
  { title = "JIT", concepts = "`mmap`, W^X, `mprotect`", gate = "JIT-compile the Arc III bytecode" },
  { title = "Stale Code", bug = 3, concepts = "cross-modifying code: another thread runs old instructions; serialization", gate = "Fix a JIT that patches code under a running thread" },
  { title = "Assembler", boss = true, concepts = "everything in the arc", gate = "Two-pass assembler for an x86 subset" },
]

[[arc]]
id = "XI"
name = "Real Mode & Boot"
runner = "qemu"
levels = [
  { title = "Power On", concepts = "reset vector, BIOS, MBR, `0x7C00`, `0xAA55`, `bits 16`, `org`; QEMU + gdb", gate = "Step from the reset vector; boot sector that halts" },
  { title = "Segmentation", concepts = "segment:offset, far pointers", gate = "Print via `int 10h` with correct segments" },
  { title = "Wrong Segment", bug = 2, concepts = "assuming BIOS register state; `org` vs segment mismatch", gate = "Fix a boot sector that works in one emulator and not another" },
  { title = "VGA Text Mode", concepts = "`0xB8000`, attributes, cursor ports", gate = "Draw a colored box" },
  { title = "Port I/O", concepts = "`in`, `out`, 16550 UART", gate = "Serial hello" },
  { title = "Disk", concepts = "`int 13h` CHS/LBA", gate = "Load a stage-2 loader" },
